<svg xmlns="http://www.w3.org/2000/svg" width="920" height="926" viewBox="0 0 920 926">
<!--
  PDF engine icon set — 38 icons, 24x24 grid, stroke-based, inherits currentColor.

  As a sprite:  <svg class="icon"><use href="icons.svg#i-select"/></svg>
  CSS:          .icon{width:24px;height:24px;fill:none;stroke:currentColor;
                      stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  Cross-file <use> needs http(s), not file:// — serve the folder.

  Opening this file directly renders the contact sheet at the bottom.
  Symbols that need a solid part carry fill="currentColor" locally.
-->

<defs>

<!-- ===== Editor toolbar ===== -->

<symbol id="i-select" viewBox="0 0 24 24">
  <path d="M4 4.5 11 20l2.2-6.2L19.5 11z"/>
</symbol>

<symbol id="i-text" viewBox="0 0 24 24">
  <path d="M5 6.5V5h14v1.5"/>
  <path d="M12 5v14"/>
  <path d="M9 19h6"/>
</symbol>

<symbol id="i-redact" viewBox="0 0 24 24">
  <rect x="3.5" y="8" width="17" height="8" rx="1" fill="currentColor" stroke="none"/>
  <path d="M3.5 4.5h5M15.5 19.5h5"/>
</symbol>

<symbol id="i-draw" viewBox="0 0 24 24">
  <path d="M4 20l1.2-4L16.4 4.8a1.7 1.7 0 0 1 2.4 0l.4.4a1.7 1.7 0 0 1 0 2.4L8 19z"/>
  <path d="M14.8 6.4l2.8 2.8"/>
</symbol>

<symbol id="i-stamp" viewBox="0 0 24 24">
  <path d="M9 4.5h6a2 2 0 0 1 2 2.2l-.5 4.3H7.5L7 6.7a2 2 0 0 1 2-2.2z"/>
  <rect x="4.5" y="11" width="15" height="4" rx="1"/>
  <rect x="4.5" y="17" width="15" height="2.5" rx="1" fill="currentColor" stroke="none"/>
</symbol>

<symbol id="i-crop" viewBox="0 0 24 24">
  <path d="M6.5 2.5v15h15"/>
  <path d="M2.5 6.5h15v15"/>
</symbol>

<symbol id="i-rotate-left" viewBox="0 0 24 24">
  <path d="M4 5.5v5h5"/>
  <path d="M4.2 10.5A8 8 0 1 1 5 15.6"/>
</symbol>

<symbol id="i-rotate-right" viewBox="0 0 24 24">
  <path d="M20 5.5v5h-5"/>
  <path d="M19.8 10.5A8 8 0 1 0 19 15.6"/>
</symbol>

<!-- ===== Page and document buttons ===== -->

<symbol id="i-open-pdf" viewBox="0 0 24 24">
  <path d="M13.5 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8.5z"/>
  <path d="M13.5 3.5v5h5"/>
  <path d="M9 16.5v-4h1.6a1.3 1.3 0 0 1 0 2.6H9"/>
</symbol>

<symbol id="i-open-another" viewBox="0 0 24 24">
  <path d="M15.5 2.5H9A1.5 1.5 0 0 0 7.5 4v12A1.5 1.5 0 0 0 9 17.5h8a1.5 1.5 0 0 0 1.5-1.5V5.5z"/>
  <path d="M15.5 2.5v3h3"/>
  <path d="M4.5 7v13a1.5 1.5 0 0 0 1.5 1.5h9"/>
  <path d="M13 10v5M10.5 12.5h5"/>
</symbol>

<symbol id="i-select-all" viewBox="0 0 24 24">
  <rect x="3.5" y="3.5" width="17" height="17" rx="2" stroke-dasharray="3.2 2.4"/>
  <path d="M8 12.2l2.6 2.8L16 8.8"/>
</symbol>

<symbol id="i-deselect" viewBox="0 0 24 24">
  <rect x="3.5" y="3.5" width="17" height="17" rx="2" stroke-dasharray="3.2 2.4"/>
  <path d="M9 9l6 6M15 9l-6 6"/>
</symbol>

<symbol id="i-extract" viewBox="0 0 24 24">
  <path d="M14.5 3.5H8A1.5 1.5 0 0 0 6.5 5v14A1.5 1.5 0 0 0 8 20.5h8a1.5 1.5 0 0 0 1.5-1.5v-4"/>
  <path d="M14.5 3.5v5h5"/>
  <path d="M13 12.5h8M18 9.5l3 3-3 3"/>
</symbol>

<symbol id="i-insert-after" viewBox="0 0 24 24">
  <rect x="3" y="4.5" width="9" height="15" rx="1.5"/>
  <path d="M17 8.5v8M13 12.5h8"/>
  <path d="M15.5 4.5h5M15.5 20.5h5" stroke-dasharray="2.5 2"/>
</symbol>

<symbol id="i-delete" viewBox="0 0 24 24">
  <path d="M4.5 6.5h15"/>
  <path d="M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7"/>
  <path d="M6.5 6.5l.9 12.1A1.5 1.5 0 0 0 8.9 20h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-12.1"/>
  <path d="M10.5 10v6M13.5 10v6"/>
</symbol>

<symbol id="i-revert" viewBox="0 0 24 24">
  <path d="M3.5 5v5h5"/>
  <path d="M3.7 10A8.5 8.5 0 1 1 4 14.8"/>
  <path d="M12 8.5V12l2.5 1.8"/>
</symbol>

<symbol id="i-save-copy" viewBox="0 0 24 24">
  <path d="M7 2.5h7.4L19 7v8.5A1.5 1.5 0 0 1 17.5 17h-8A1.5 1.5 0 0 1 8 15.5V4A1.5 1.5 0 0 1 9.5 2.5z"/>
  <path d="M11 2.5v4h5.5"/>
  <path d="M3.5 8v12A1.5 1.5 0 0 0 5 21.5h9"/>
</symbol>

<symbol id="i-save" viewBox="0 0 24 24">
  <path d="M4.5 5.5A2 2 0 0 1 6.5 3.5h9L20.5 8.5v10a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2z"/>
  <path d="M8 3.5v5h6v-5"/>
  <rect x="8" y="13" width="8" height="7.5" rx="1"/>
</symbol>

<!-- ===== Reader controls ===== -->

<symbol id="i-prev-page" viewBox="0 0 24 24">
  <path d="M14.5 5.5L8 12l6.5 6.5"/>
</symbol>

<symbol id="i-next-page" viewBox="0 0 24 24">
  <path d="M9.5 5.5L16 12l-6.5 6.5"/>
</symbol>

<symbol id="i-zoom-out" viewBox="0 0 24 24">
  <circle cx="10.5" cy="10.5" r="6.5"/>
  <path d="M15.5 15.5L21 21"/>
  <path d="M7.5 10.5h6"/>
</symbol>

<symbol id="i-zoom-in" viewBox="0 0 24 24">
  <circle cx="10.5" cy="10.5" r="6.5"/>
  <path d="M15.5 15.5L21 21"/>
  <path d="M7.5 10.5h6M10.5 7.5v6"/>
</symbol>

<symbol id="i-all-pages" viewBox="0 0 24 24">
  <rect x="3" y="3.5" width="8" height="8" rx="1"/>
  <rect x="13" y="3.5" width="8" height="8" rx="1"/>
  <rect x="3" y="13" width="8" height="8" rx="1"/>
  <rect x="13" y="13" width="8" height="8" rx="1"/>
</symbol>

<symbol id="i-thumbnails" viewBox="0 0 24 24">
  <rect x="2.5" y="6" width="5" height="12" rx="1"/>
  <rect x="9.5" y="6" width="5" height="12" rx="1"/>
  <rect x="16.5" y="6" width="5" height="12" rx="1"/>
  <path d="M9.5 20.5h5" stroke-width="2.5"/>
</symbol>

<!-- ===== Tool panes ===== -->

<symbol id="i-scope-this-page" viewBox="0 0 24 24">
  <rect x="5.5" y="3" width="13" height="18" rx="1.5"/>
  <rect x="8.5" y="9" width="7" height="4" rx="0.6" fill="currentColor" stroke="none"/>
</symbol>

<symbol id="i-scope-all-pages" viewBox="0 0 24 24">
  <path d="M8 2.5h9.5A1.5 1.5 0 0 1 19 4v13"/>
  <rect x="4" y="5.5" width="12" height="16" rx="1.5"/>
  <rect x="6.5" y="11" width="7" height="3.5" rx="0.6" fill="currentColor" stroke="none"/>
</symbol>

<symbol id="i-scope-selection" viewBox="0 0 24 24">
  <rect x="3.5" y="4.5" width="17" height="15" rx="1.5" stroke-dasharray="3 2.4"/>
  <rect x="7.5" y="9" width="9" height="6" rx="1" fill="currentColor" stroke="none"/>
</symbol>

<symbol id="i-apply-redactions" viewBox="0 0 24 24">
  <rect x="3.5" y="5" width="17" height="6" rx="1" fill="currentColor" stroke="none"/>
  <path d="M3.5 14.5h8"/>
  <path d="M12.5 18.2l2.6 2.8 5.4-6.6"/>
</symbol>

<symbol id="i-remove-redaction" viewBox="0 0 24 24">
  <rect x="3.5" y="6" width="17" height="6" rx="1" fill="currentColor" stroke="none"/>
  <circle cx="16.5" cy="17" r="4.5"/>
  <path d="M14.4 17h4.2"/>
</symbol>

<symbol id="i-ocr" viewBox="0 0 24 24">
  <path d="M3.5 8V5.5A2 2 0 0 1 5.5 3.5H8"/>
  <path d="M20.5 8V5.5a2 2 0 0 0-2-2H16"/>
  <path d="M3.5 16v2.5a2 2 0 0 0 2 2H8"/>
  <path d="M20.5 16v2.5a2 2 0 0 1-2 2H16"/>
  <path d="M8 9V8h8v1"/>
  <path d="M12 8v8M10.2 16h3.6"/>
</symbol>

<symbol id="i-compress-images" viewBox="0 0 24 24">
  <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
  <circle cx="8.5" cy="8.5" r="1.6"/>
  <path d="M4 17l4.5-4.5 3.2 3.2"/>
  <path d="M20 8.5l-4 4"/>
  <path d="M16.5 12.5h3.5M16.5 12.5V9"/>
  <path d="M13 19.5l3.5-3.5"/>
</symbol>

<symbol id="i-page-numbers" viewBox="0 0 24 24">
  <rect x="5" y="2.5" width="14" height="19" rx="1.5"/>
  <path d="M8 7h8M8 10.5h8M8 14h5"/>
  <path d="M10.8 18.5h1.2v-2.6l-1.2.7"/>
  <path d="M13.8 16.6a1.1 1.1 0 1 1 1.9.8l-1.9 1.1h2.1"/>
</symbol>

<!-- ===== Pair-document controls ===== -->

<symbol id="i-move-right" viewBox="0 0 24 24">
  <rect x="2.5" y="5" width="7" height="14" rx="1.2"/>
  <rect x="14.5" y="5" width="7" height="14" rx="1.2" stroke-dasharray="3 2.2"/>
  <path d="M9.5 12h5M12.5 9.5l2.5 2.5-2.5 2.5"/>
</symbol>

<symbol id="i-move-left" viewBox="0 0 24 24">
  <rect x="14.5" y="5" width="7" height="14" rx="1.2"/>
  <rect x="2.5" y="5" width="7" height="14" rx="1.2" stroke-dasharray="3 2.2"/>
  <path d="M14.5 12h-5M11.5 9.5L9 12l2.5 2.5"/>
</symbol>

<symbol id="i-copy-right" viewBox="0 0 24 24">
  <rect x="2.5" y="5" width="7" height="14" rx="1.2"/>
  <rect x="4.8" y="2.8" width="7" height="14" rx="1.2" opacity=".55"/>
  <rect x="14.5" y="5" width="7" height="14" rx="1.2"/>
  <path d="M10 12h4.5M12.5 9.8l2.2 2.2-2.2 2.2"/>
</symbol>

<symbol id="i-swap-sides" viewBox="0 0 24 24">
  <rect x="2.5" y="5" width="7" height="14" rx="1.2"/>
  <rect x="14.5" y="5" width="7" height="14" rx="1.2"/>
  <path d="M10 9h4M12.2 7l2 2-2 2"/>
  <path d="M14 15h-4M11.8 13l-2 2 2 2"/>
</symbol>

<symbol id="i-close" viewBox="0 0 24 24">
  <path d="M6 6l12 12M18 6L6 18"/>
</symbol>

<symbol id="i-save-as-new-file" viewBox="0 0 24 24">
  <path d="M4.5 5.5a2 2 0 0 1 2-2h7L18.5 8.5v6"/>
  <path d="M4.5 5.5v13a2 2 0 0 0 2 2h5"/>
  <path d="M8 3.5v4h13"/>
  <path d="M17.5 14v7M14 17.5h7"/>
</symbol>

</defs>

<!-- ===== Contact sheet (display only — not part of the sprite) ===== -->

<rect width="920" height="926" fill="#ffffff"/>
<text x="20" y="34" font-family="system-ui, sans-serif" font-size="16" fill="#1a1f27">pdf engine icon set — 38 icons, 24×24, currentColor</text>

<g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#1a1f27">

