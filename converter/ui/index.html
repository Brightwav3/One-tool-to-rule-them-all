<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Tool</title>
<style>
/* One Tool tokens. This surface follows the prototype, not the web workspace system. */

:root {
  /* colours */
  --gray-0:#FFFFFF; --gray-50:#FAFAFA; --gray-100:#F4F4F4; --gray-200:#EBEBEB;
  --gray-300:#E0E0E0; --gray-400:#C7C7C7; --gray-500:#9E9E9E; --gray-600:#5D5D5D; --gray-900:#292929;
  --blue-50:#EEF3FE; --blue-100:#D7E4FD; --blue-500:#2C6EF5; --blue-600:#1F5AD8; --blue-700:#1A4CB8;
  --green-50:#E9F6EE; --green-500:#2E9E5B; --green-600:#248049;
  --amber-50:#FBF2E1; --amber-500:#C9820A; --amber-600:#A66A07;
  --red-50:#FCECEC; --red-500:#DC3B3B; --red-600:#BE2E2E;

  --text-primary:var(--gray-900); --text-secondary:var(--gray-600); --text-tertiary:var(--gray-500);
  --text-inverse:var(--gray-0); --text-accent:var(--blue-600); --text-disabled:var(--gray-400);
  --surface-page:var(--gray-0); --surface-card:var(--gray-0); --surface-sunken:var(--gray-100);
  --surface-hover:var(--gray-100); --surface-active:var(--gray-200); --surface-inverse:var(--gray-900);
  --border-subtle:var(--gray-200); --border-default:var(--gray-300); --border-strong:var(--gray-400);
  --border-focus:var(--blue-500);
  --accent:var(--blue-500); --accent-hover:var(--blue-600); --accent-active:var(--blue-700); --accent-soft:var(--blue-50);
  --success:var(--green-500); --success-soft:var(--green-50);
  --warning:var(--amber-500); --warning-soft:var(--amber-50);
  --danger:var(--red-500); --danger-hover:var(--red-600); --danger-soft:var(--red-50);
  --ring:0 0 0 3px var(--blue-100);

  /* type — only four sizes exist */
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Monaco,monospace;
  --weight-regular:400; --weight-medium:500;
  --text-xs:12px; --text-sm:13px; --text-base:14px; --text-2xl:24px;
  --leading-tight:1.25; --leading-snug:1.35; --leading-normal:1.5;
  --tracking:-0.15px;

  /* spacing — 4px grid */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --pad-control-x:12px; --pad-control-y:7px; --pad-card:16px; --gap-nav:4px; --gap-inline:8px;

  /* radii */
  --radius-xs:4px; --radius-nav:8px; --radius-card:16px; --radius-pill:9999px;

  /* elevation */
  --shadow-none:none;
  --shadow-card:0 1px 2px rgba(41,41,41,.05),0 1px 3px rgba(41,41,41,.04);
  --shadow-raised:0 4px 12px rgba(41,41,41,.08),0 1px 3px rgba(41,41,41,.05);
  --shadow-popover:0 8px 24px rgba(41,41,41,.12),0 2px 6px rgba(41,41,41,.06);
  --shadow-modal:0 24px 64px rgba(41,41,41,.18),0 8px 20px rgba(41,41,41,.08);

  /* Motion — the transitions.dev scale from Motion Showcase.dc.html.
     Fidelio's 120-160ms guidance is scoped to background/border/opacity hover states,
     which is --d-quick below. Structural motion (panel, page, modal, popover, toast)
     uses the showcase scale, or a 308px panel slide reads as a jump rather than a move.
     Three rules: opens are slower than closes; reversible motions are symmetric;
     overshoot is for entrances only. */
  --d-quick:150ms; --d-fast:250ms; --d-medium:350ms; --d-slow:400ms; --d-vslow:500ms; --stagger:50ms;
  --ease:cubic-bezier(.22,1,.36,1); --ease-bounce:cubic-bezier(.34,1.36,.64,1); --ease-spring:cubic-bezier(.34,1.45,.64,1);
  --ease-inout:cubic-bezier(.4,0,.2,1);
  --scrim:rgba(41,41,41,.32);
}

@media (prefers-contrast:more){
  :root{--border-subtle:var(--gray-400);--border-default:var(--gray-500);--text-secondary:#3d3d3d;--text-tertiary:#5d5d5d}
}

/* Prototype token block: keep these values verbatim so the renderer and the design
   reference share the same native desktop scale. The compatibility aliases below
   keep the backend-connected renderer class names readable without changing the
   visual source of truth. */
:root{
  --bg:#f2f2f4;--surface:#ffffff;--raised:#ffffff;
  --quiet:rgba(60,60,67,.055);--quiet2:rgba(60,60,67,.10);--quiet3:rgba(60,60,67,.15);
  --sep:rgba(60,60,67,.13);--sep2:rgba(60,60,67,.24);
  --t1:#1d1d1f;--t2:rgba(60,60,67,.72);--t3:rgba(60,60,67,.52);--t4:rgba(60,60,67,.34);
  --acc:#0b6bcb;--acc-h:#0a5fb5;--acc-text:#0b6bcb;--acc-tint:rgba(11,107,203,.10);--acc-tint2:rgba(11,107,203,.18);
  --ok:#2f9e57;--ok-t:#1a7a41;--ok-tint:rgba(47,158,87,.12);
  --warn:#e08600;--warn-t:#8a5300;--warn-tint:rgba(224,134,0,.12);
  --dang:#e0483e;--dang-t:#b3261e;--dang-tint:rgba(224,72,62,.10);
  --sh1:0 1px 2px rgba(0,0,0,.06);--sh2:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.08);
  --sh3:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16);
  --stripe:rgba(60,60,67,.10);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Helvetica Neue",Helvetica,sans-serif;
  --page:#e8e6e1;
  --d-quick:150ms;--d-fast:250ms;--d-medium:350ms;--d-slow:400ms;--d-vslow:500ms;--d-stagger:50ms;
  --ease:cubic-bezier(.22,1,.36,1);--ease-bounce:cubic-bezier(.34,1.36,.64,1);--ease-spring:cubic-bezier(.34,1.45,.64,1);
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:var(--t1);
  --text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-inverse:#fff;--text-accent:var(--acc-text);--text-disabled:var(--t4);
  --border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--border-focus:var(--acc);
  --accent:var(--acc);--accent-hover:var(--acc-h);--accent-active:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);
  --font-sans:var(--ui);--font-mono:var(--mono);--weight-regular:400;--weight-medium:500;
  --text-xs:11px;--text-sm:12px;--text-base:13px;--text-2xl:25px;--leading-tight:1.25;--leading-snug:1.35;--leading-normal:1.5;--tracking:-.018em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --pad-control-x:12px;--pad-control-y:7px;--pad-card:16px;--gap-nav:4px;--gap-inline:8px;
  --radius-xs:5px;--radius-nav:8px;--radius-card:14px;--radius-pill:999px;
  --shadow-card:var(--sh1);--shadow-raised:var(--sh2);--shadow-popover:var(--sh2);--shadow-modal:var(--sh3);--scrim:rgba(20,20,22,.32);
  --dropdown-open-dur:250ms;--dropdown-close-dur:150ms;--dropdown-pre-scale:.97;--dropdown-closing-scale:.99;--dropdown-ease:cubic-bezier(.22,1,.36,1);
  --gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}
[data-theme="dark"]{
  --bg:#131315;--surface:#1c1c1f;--raised:#232326;--quiet:rgba(235,235,245,.06);--quiet2:rgba(235,235,245,.11);--quiet3:rgba(235,235,245,.16);--sep:rgba(235,235,245,.11);--sep2:rgba(235,235,245,.22);--t1:#f5f5f7;--t2:rgba(235,235,245,.70);--t3:rgba(235,235,245,.48);--t4:rgba(235,235,245,.30);--acc:#2b7fff;--acc-h:#4d9bff;--acc-text:#7fbaff;--acc-tint:rgba(43,127,255,.16);--acc-tint2:rgba(43,127,255,.28);--ok:#30d158;--ok-t:#5cd97e;--ok-tint:rgba(48,209,88,.14);--warn:#ff9f0a;--warn-t:#ffb545;--warn-tint:rgba(255,159,10,.14);--dang:#ff453a;--dang-t:#ff7d74;--dang-tint:rgba(255,69,58,.14);--page:#0a0a0b;
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:#1f2024;--text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-disabled:var(--t4);--border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--accent:var(--acc);--accent-hover:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);--gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}
[data-theme="dark"]{
  --bg:#000000;--surface:#000000;--raised:#000000;--quiet:rgba(237,237,237,.06);--quiet2:rgba(237,237,237,.11);--quiet3:rgba(237,237,237,.16);--sep:rgba(237,237,237,.12);--sep2:rgba(237,237,237,.24);--t1:#ededed;--t2:rgba(237,237,237,.70);--t3:rgba(237,237,237,.50);--t4:rgba(237,237,237,.32);--acc:#006efe;--acc-h:#2b80ff;--acc-text:#006efe;--acc-tint:rgba(0,110,254,.18);--acc-tint2:rgba(0,110,254,.30);--ok:#00ad3a;--ok-t:#2bd466;--ok-tint:rgba(0,173,58,.16);--warn:#ffad1f;--warn-t:#ffc15c;--warn-tint:rgba(255,173,31,.16);--dang:#f13342;--dang-t:#ff6874;--dang-tint:rgba(241,51,66,.16);--page:#000000;
  --ui:"Geist",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:var(--t1);--text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-disabled:var(--t4);--border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--accent:var(--acc);--accent-hover:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);--gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}

*{box-sizing:border-box}
html,body{height:100%}
html{font-family:var(--font-sans);letter-spacing:var(--tracking);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{margin:0;overflow:hidden;background:var(--surface-sunken);color:var(--text-primary);font-size:var(--text-base);font-weight:var(--weight-regular)}
button,input{font:inherit;letter-spacing:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
[hidden]{display:none!important}
[disabled]{cursor:default}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:var(--radius-xs)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* scrollbars are ours, never the platform's */
*{scrollbar-width:thin;scrollbar-color:var(--border-default) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-default);background-clip:content-box;border:3px solid transparent;border-radius:var(--radius-pill);min-height:32px;transition:background-color var(--d-quick) var(--ease)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);background-clip:content-box}
::-webkit-scrollbar-thumb:active{background:var(--text-tertiary);background-clip:content-box}

/* ---------- motion primitives ---------- */
.press{transition:transform var(--d-quick) var(--ease),background-color var(--d-quick) var(--ease),box-shadow var(--d-quick) var(--ease),color var(--d-quick) var(--ease)}
.press:active:not([disabled]){transform:scale(.97)}
/* Decorative glyphs (chevrons, tile labels) render below the system's 12px floor.
   They are scaled rather than adding a fifth size to the ramp. */
.chev{display:inline-block;font-size:var(--text-xs);transform:scale(.7);color:var(--text-tertiary);
  transition:transform var(--d-fast) var(--ease)}
/* icon morph — the chevron rotates through its own axis rather than swapping glyphs */
.chev[data-flipped="true"]{transform:scale(.7) rotate(180deg)}
.row{transition:background-color var(--d-fast) var(--ease),opacity var(--d-fast) var(--ease)}
.row:hover{background:var(--surface-hover)}
.bar-fill{transition:width var(--d-fast) linear}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.pulse{animation:pulse 1.1s ease-in-out infinite}

/* Entrance tier. Fidelio's 120-160ms band covers hover/press state changes; an element
   arriving on screen needs slightly longer to be legible. 240ms is the ceiling, and no
   entrance overshoots — the system forbids bounce. */
@keyframes row-in{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
.q-row.is-new{animation:row-in var(--d-slow) var(--ease) backwards}

/* success check — scale in, then draw the stroke */
@keyframes tick-in{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes tick-draw{to{stroke-dashoffset:0}}
.tick.is-fresh{animation:tick-in var(--d-vslow) var(--ease-bounce) both}
.tick.is-fresh svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:tick-draw var(--d-vslow) var(--ease) 80ms both}

/* queue count pop-in */
@keyframes digit-in{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
.digit{display:inline-block}
.digit.is-fresh{animation:digit-in var(--d-vslow) var(--ease-spring) both}

/* a file that cannot be read — a nudge, not a flourish */
@keyframes shake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}100%{transform:none}}
.q-row.is-error{animation:shake 240ms var(--ease) both}

/* indeterminate work only — where an honest page count genuinely does not exist */
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.status.indeterminate{background:linear-gradient(100deg,var(--text-secondary) 30%,var(--text-primary) 50%,var(--text-secondary) 70%);
  background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}

/* helpers badge */
@keyframes badge-in{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.navdot.is-fresh{animation:badge-in var(--d-medium) var(--ease-bounce) both}

/* skeleton shown while a pick/drop is in flight */
.skel{position:absolute;inset:0;z-index:2;border-radius:var(--radius-card);background:var(--surface-card);overflow:hidden;
  transition:opacity var(--d-slow) var(--ease)}
.skel[data-done="true"]{opacity:0;pointer-events:none}
.skel-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle)}
.skel-b{display:block;border-radius:var(--radius-xs);background:var(--surface-active)}

/* ---------- app shell ---------- */
.app{height:100%;min-width:760px;display:flex;flex-direction:column;position:relative}

.topbar{height:44px;flex:none;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);-webkit-app-region:drag;user-select:none;position:relative;z-index:12;
  transition:padding-right var(--d-slow) var(--ease)}
/* when the inspector is closed the window controls sit over the bar's right end,
   so the bar yields the space; when it is open they sit over the panel instead */
.app[data-inspector="false"] .topbar{padding-right:116px;transition-duration:var(--d-medium)}
body.is-mac .topbar{padding-left:82px}
.topbar button,.wincontrols{-webkit-app-region:no-drag}
.nav{display:flex;align-items:center;gap:var(--space-4)}
.navbtn{position:relative;min-height:26px;padding:0 9px;border-radius:var(--radius-nav);font-size:var(--text-sm);font-weight:var(--weight-regular);color:var(--text-secondary);transition:background-color var(--d-quick) var(--ease),color var(--d-quick) var(--ease)}
.navbtn:hover{background:var(--surface-hover)}
.navbtn.active{background:var(--accent);color:var(--text-inverse);font-weight:var(--weight-medium)}
.navdot{position:absolute;top:2px;right:1px;width:7px;height:7px;border-radius:var(--radius-pill);background:var(--warning);box-shadow:0 0 0 2px var(--surface-sunken)}
.searchwrap{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
.theme-host{flex:none;position:relative;display:flex;align-items:center}
.theme-toggle{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-nav);-webkit-app-region:no-drag}
.theme-toggle:hover{background:var(--surface-hover)}
.theme-logo{display:block;width:19px;height:19px;background:var(--text-secondary);-webkit-mask:url('/fidelioB.svg') center/contain no-repeat;mask:url('/fidelioB.svg') center/contain no-repeat;transition:background-color var(--d-quick) var(--ease),-webkit-mask-image var(--d-quick) var(--ease)}
[data-theme="dark"] .theme-logo{background:var(--text-primary);-webkit-mask-image:url('/fidelioW.svg');mask-image:url('/fidelioW.svg')}
.theme-toggle.is-spinning .theme-logo{animation:theme-spin 520ms var(--ease) both}
@keyframes theme-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.theme-host .tip{left:0;right:auto}
.search{display:flex;align-items:center;gap:var(--gap-inline);width:330px;height:28px;padding:0 10px;border-radius:var(--radius-nav);background:var(--surface-hover);font-size:var(--text-sm);color:var(--text-tertiary);transition:background-color var(--d-quick) var(--ease)}
.search:hover{background:var(--surface-active)}
.search .label{flex:1;text-align:left}
.kbd{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);padding:2px 5px;border-radius:var(--radius-xs);background:var(--surface-active);color:var(--text-tertiary)}
.tiphost{position:relative}
.insp-toggle{width:30px;height:26px;display:grid;place-items:center;border-radius:var(--radius-nav);color:var(--text-secondary)}
.insp-toggle:hover{background:var(--surface-hover)}
.insp-toggle.on{background:var(--accent);color:var(--text-inverse)}
#app[data-inspector="true"] .insp-toggle{background:var(--accent);color:var(--text-inverse)}
.tip{position:absolute;top:32px;right:0;display:flex;align-items:center;gap:var(--space-2);padding:5px 9px;border-radius:var(--radius-nav);background:var(--surface-inverse);color:var(--text-inverse);font-size:var(--text-xs);font-weight:var(--weight-medium);white-space:nowrap;box-shadow:var(--shadow-popover);opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity var(--d-quick) ease-out,transform var(--d-quick) ease-out;z-index:5}
[data-theme="dark"] .tip{background:#1f2024;color:#ededed}
.tiphost:hover .tip{opacity:1;transform:none;transition-delay:80ms}
.tip .kbd{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.wincontrols{position:absolute;top:0;right:var(--space-3);height:44px;display:none;align-items:center;gap:2px;z-index:14}
.is-electron:not(.is-mac) .wincontrols{display:flex}
.wincontrols button{width:30px;height:26px;display:grid;place-items:center;border-radius:var(--radius-xs);color:var(--text-tertiary);-webkit-app-region:no-drag;pointer-events:auto;cursor:pointer}
.wincontrols button:hover{background:var(--surface-active);color:var(--text-primary)}
.wincontrols .close:hover{background:var(--danger);color:var(--text-inverse)}
.wincontrols svg{width:10px;height:10px}

.body{flex:1;min-height:0;display:flex}
.left{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.work{flex:1;min-height:0;margin:var(--space-2);border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:0 2px 5px rgba(41,41,41,.07),0 1px 2px rgba(41,41,41,.05);display:flex;flex-direction:column;overflow:hidden;position:relative}

/* page side-by-side */
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(var(--px,8px));filter:blur(3px);
  transition:opacity var(--d-fast) var(--ease),transform var(--d-fast) var(--ease),filter var(--d-fast) var(--ease)}
.page[data-active="true"]{opacity:1;transform:none;filter:blur(0);pointer-events:auto}

h1{margin:0;font-size:var(--text-2xl);font-weight:var(--weight-medium);line-height:var(--leading-tight)}
.page-sub{margin:var(--space-2) 0 0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--text-secondary);max-width:64ch}
.eyebrow{display:block;font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}

/* ---------- buttons ---------- */
.btn{min-height:32px;padding:0 var(--pad-control-x);display:inline-flex;align-items:center;justify-content:center;gap:var(--gap-inline);border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:var(--weight-medium);white-space:nowrap}
.btn-primary{background:var(--surface-inverse);color:var(--text-inverse)}
.btn-primary:hover:not([disabled]){background:#1c1c1c}
.btn-primary[disabled]{background:var(--gray-300);color:var(--text-disabled)}
.btn-secondary{color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-default)}
.btn-secondary:hover:not([disabled]){background:var(--surface-hover)}
.btn-accent{background:var(--accent-soft);color:var(--text-accent)}
.btn-accent:hover:not([disabled]){background:var(--blue-100)}
.btn-ghost{color:var(--text-secondary)}
.btn-ghost:hover:not([disabled]){background:var(--surface-hover)}
.btn-danger{background:var(--danger-soft);color:var(--danger-hover);box-shadow:inset 0 0 0 1px rgba(220,59,59,.24)}
.btn-danger:hover:not([disabled]){background:#f8dede}
.btn-sm{min-height:28px;padding:0 10px;font-size:var(--text-xs)}
.link{color:var(--text-accent);font-weight:var(--weight-medium);text-decoration:underline;text-underline-offset:2px}

/* ---------- queue ---------- */
.q-wrap{flex:1;min-height:0;padding:var(--space-4) var(--space-5) 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.q-head{flex:none;display:flex;align-items:flex-start;gap:var(--space-3)}
.q-head .grow{flex:1;min-width:0}
.dest{display:flex;align-items:center;gap:var(--gap-inline);padding:var(--space-1) var(--space-2) var(--space-1) var(--space-1);border-radius:var(--radius-nav);background:var(--surface-sunken);font-size:var(--text-sm);position:relative}
.dest .k{font-weight:var(--weight-medium);color:var(--text-secondary)}
.dest .v{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)}
.dest-trigger{display:flex;align-items:center;gap:var(--gap-inline);min-width:0;padding:var(--space-1) var(--space-2);border-radius:var(--radius-xs);text-align:left}
.dest-trigger:hover{background:var(--surface-active)}
.dest-trigger .v{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest-trigger .chev{color:var(--text-tertiary);font-size:10px;transition:transform var(--d-quick) var(--ease)}
.dest-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}
.path-menu{position:absolute;top:calc(100% + 8px);right:0;width:330px;padding:var(--space-1);z-index:18;border:1px solid var(--border-subtle);border-radius:var(--radius-nav);background:var(--surface-card);box-shadow:var(--shadow-popover);transform-origin:top right}
.path-menu .menu-title{display:block;padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}
.path-row{display:flex;align-items:center;gap:var(--space-1);min-height:34px;border-radius:var(--radius-xs)}
.path-row:hover{background:var(--surface-hover)}
.path-row .path-pick{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);text-align:left}
.path-row .path-pick .check{width:12px;flex:none;color:var(--text-accent);font-size:var(--text-xs);text-align:center}
.path-row .path-pick .path-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)}
.path-row .forget-path{width:26px;height:26px;flex:none;margin-right:3px;border-radius:var(--radius-xs);color:var(--text-disabled);opacity:0;font-size:15px;line-height:1}
.path-row:hover .forget-path,.path-row .forget-path:focus-visible{opacity:1}
.path-row .forget-path:hover{background:var(--surface-active);color:var(--text-primary)}
.path-empty{padding:var(--space-3) var(--space-2);font-size:var(--text-sm);color:var(--text-tertiary)}
.path-foot{display:flex;align-items:center;margin-top:var(--space-1);padding:var(--space-2) var(--space-2) var(--space-1);border-top:1px solid var(--border-subtle)}
.path-foot .link{padding:0}
.q-list{flex:1;min-height:0;margin-top:var(--space-4);border-radius:var(--radius-card);border:1px solid var(--border-subtle);background:var(--surface-card);display:flex;flex-direction:column;overflow:visible;position:relative}
.q-row{flex:none;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle);position:relative;cursor:default}
.q-row:first-child{border-radius:var(--radius-card) var(--radius-card) 0 0}
.q-row.selected{background:var(--accent-soft)}
.q-row.selected:hover{background:var(--accent-soft)}
.q-row.dim{opacity:.8}
.q-row.open{z-index:6}
.thumb{width:34px;height:44px;flex:none;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:repeating-linear-gradient(135deg,var(--gray-200) 0 4px,transparent 4px 8px),var(--surface-sunken);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-tertiary);overflow:hidden}
/* the tile label sits below the system's 12px floor, so it is scaled rather than
   introducing a fifth type size */
.thumb > span{display:block;transform:scale(.55);transform-origin:bottom center;white-space:nowrap}
.f-copy{flex:1;min-width:0}
.f-name{font-size:var(--text-base);font-weight:var(--weight-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-meta{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary);margin-top:var(--space-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-wrap{display:inline-flex;flex:none;position:relative}
.pill{display:inline-flex;align-items:center;gap:var(--space-2);height:26px;padding:0 10px;border-radius:var(--radius-pill);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);background:var(--surface-sunken);color:var(--text-secondary)}
.pill:hover{background:var(--surface-active)}
.pill .chev{opacity:.7;color:currentColor}
.pill.open .chev{transform:scale(.7) rotate(180deg)}
.q-row.selected .pill{background:var(--gray-0);color:var(--text-accent)}
.pill.blocked{background:var(--warning-soft);color:var(--amber-600)}
.pill.open{background:var(--accent);color:var(--text-inverse)}
.prog{width:132px;flex:none}
.prog-track{height:4px;border-radius:var(--radius-pill);background:var(--border-subtle);overflow:hidden}
.prog-bar{height:100%;border-radius:var(--radius-pill);background:var(--accent)}
.prog-bar.done{background:var(--success)}
.prog-foot{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-1);margin-top:var(--space-2)}
.status{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary)}
.status.done{color:var(--green-600)}
.status.blocked{color:var(--amber-600)}
.status.failed{color:var(--danger-hover)}
.tick{width:14px;height:14px;display:grid;place-items:center;border-radius:var(--radius-pill);background:var(--success);color:var(--text-inverse)}
.tick svg{display:block}
.rm{width:22px;flex:none;text-align:center;color:var(--text-disabled);font-size:var(--text-base);line-height:1}
.rm:hover{color:var(--text-primary)}
.dropmore{flex:none;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--text-secondary);text-align:left;border:0;width:100%}
.dropmore .plus{width:34px;text-align:center;color:var(--accent);font-size:var(--text-base)}
.dropmore .k{margin-left:auto;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
.q-fill{flex:1;min-height:0}
.q-list.over,.empty-drop.over{border-color:var(--accent);background:var(--accent-soft)}

.empty{flex:1;min-height:0;display:grid;place-items:center;padding:var(--space-8)}
.empty-inner{text-align:center;max-width:520px}
.empty-glyph{width:48px;height:48px;margin:0 auto;display:grid;place-items:center;color:var(--accent);line-height:1}
.empty-glyph svg{display:block;width:48px;height:48px}
.empty h1{margin-top:var(--space-6)}
.empty p{font-size:var(--text-base);line-height:var(--leading-normal);color:var(--text-secondary);margin:var(--space-3) 0 0;text-wrap:pretty}
.empty .actions{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-top:var(--space-6)}
.empty-drop{border:1px dashed var(--border-default);border-radius:var(--radius-card);transition:background-color var(--d-fast) var(--ease),border-color var(--d-fast) var(--ease)}

.foot{flex:none;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);border-top:1px solid var(--border-subtle)}
.foot .summary{flex:1;font-size:var(--text-sm);color:var(--text-secondary)}
.go{min-width:142px;min-height:34px;display:grid;place-items:center}
.go > span{grid-area:1/1;display:inline-flex;align-items:center;gap:var(--gap-inline);opacity:0;transform:translateY(4px);filter:blur(2px);white-space:nowrap;
  transition:opacity var(--d-quick) var(--ease-inout),transform var(--d-quick) var(--ease-inout),filter var(--d-quick) var(--ease-inout)}
.go > span[data-on="true"]{opacity:1;transform:none;filter:blur(0)}
.spin{width:12px;height:12px;border-radius:var(--radius-pill);border:1.5px solid rgba(255,255,255,.35);border-top-color:var(--text-inverse);display:inline-block;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- popover ---------- */
.pop{position:absolute;top:calc(100% + 6px);right:0;width:262px;z-index:6;text-align:left;opacity:0;transform:scale(.97) translateY(-4px);filter:blur(2px);transform-origin:top right;pointer-events:none;
  transition:opacity var(--d-quick) var(--ease),transform var(--d-quick) var(--ease),filter var(--d-quick) var(--ease)}
.pop[data-open="true"]{opacity:1;transform:none;filter:blur(0);pointer-events:auto;transition-duration:var(--d-fast)}
.pop-card{display:block;border-radius:var(--radius-nav);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-popover);overflow:hidden}
.pop-title{display:block;padding:10px var(--space-3) 9px;border-bottom:1px solid var(--border-subtle);font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary)}
.pop-body{display:block;padding:var(--space-1)}
.opt{width:100%;display:flex;align-items:center;gap:var(--space-2);min-height:34px;padding:var(--pad-control-y) var(--space-2);border-radius:var(--radius-nav);text-align:left}
.opt:hover:not([disabled]){background:var(--surface-hover)}
.opt.current{background:var(--accent-soft)}
.opt .ck{width:12px;flex:none;text-align:center;font-size:var(--text-xs);color:var(--text-accent)}
.opt .nm{flex:1;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium)}
.opt .st{font-size:var(--text-xs);color:var(--text-tertiary)}
.opt .st.ready{color:var(--green-600)}
.opt .st.helper{color:var(--amber-600)}
.opt[disabled]{opacity:.5}
.pop-foot{display:flex;align-items:center;gap:var(--gap-inline);padding:var(--space-2) 9px 9px var(--space-3);border-top:1px solid var(--border-subtle)}
.pop-foot .note{flex:1;font-size:var(--text-xs);line-height:var(--leading-snug);color:var(--text-tertiary)}
.scope-card{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);padding:9px var(--space-3);border-radius:var(--radius-nav);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-raised)}
.scope{flex:1;min-width:0;min-height:28px;padding:5px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--radius-nav);font-size:var(--text-sm);background:var(--surface-sunken);box-shadow:inset 0 0 0 1px var(--border-default)}
.scope:hover{background:var(--surface-active)}


/* ---------- helpers page ---------- */
.h-wrap{padding:var(--space-5) var(--space-6) 0}
.h-list{flex:1;min-height:0;margin-top:var(--space-4);border-radius:var(--radius-card);border:1px solid var(--border-subtle);background:var(--surface-card);overflow:auto}
.h-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle);width:100%;text-align:left;cursor:default}
.h-row[data-selected="true"],.h-row[data-selected="true"]:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;flex:none;border-radius:var(--radius-pill)}
.dot.ok{background:var(--success)}
.dot.miss{background:var(--warning)}
.h-copy{display:block;flex:1;min-width:0}
.h-copy b{display:block;font-size:var(--text-base);font-weight:var(--weight-medium)}
.h-copy .sub{display:block;margin-top:var(--space-1);font-size:var(--text-sm);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-state{font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary)}
.h-state.ok{color:var(--green-600)}
.h-state.miss{color:var(--amber-600)}
.page-foot{flex:none;padding:var(--space-3) 0;font-size:var(--text-xs);color:var(--text-tertiary)}

/* ---------- history page ---------- */
.x-wrap{padding:var(--space-5) var(--space-6) 0}
.chips{flex:none;display:flex;align-items:center;gap:var(--gap-inline);margin-top:var(--space-4);flex-wrap:wrap}
.chip{min-height:26px;padding:0 10px;display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-pill);font-size:var(--text-sm);color:var(--text-secondary);box-shadow:inset 0 0 0 1px var(--border-default)}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--accent-soft);color:var(--text-accent);font-weight:var(--weight-medium);box-shadow:none}
.chip .n{font-family:var(--font-mono);font-size:var(--text-xs);opacity:.7}
.x-list{flex:1;min-height:0;margin-top:var(--space-3);border-radius:var(--radius-card);border:1px solid var(--border-subtle);background:var(--surface-card);overflow:auto}
.x-head{display:flex;align-items:center;gap:var(--space-3);padding:9px var(--space-4);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;background:var(--surface-card);z-index:1}
.x-head span{font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}
.x-row{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-4);border-bottom:1px solid var(--border-subtle);width:100%;text-align:left;cursor:default}
.x-row[data-selected="true"],.x-row[data-selected="true"]:hover{background:var(--accent-soft)}
.x-row[data-multi-selected="true"],.x-row[data-multi-selected="true"]:hover{background:var(--accent-soft)}
.check{width:15px;height:15px;flex:none;border-radius:var(--radius-xs);display:grid;place-items:center;font-size:9px;color:var(--text-inverse);box-shadow:inset 0 0 0 1px var(--border-default)}
.check.on{background:var(--accent);box-shadow:none}
.x-tile{width:26px;height:32px;flex:none;border-radius:var(--radius-xs);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-tertiary);background:var(--surface-sunken);border:1px solid var(--border-subtle);overflow:hidden}
.x-tile>span{display:block;transform:scale(.62);transform-origin:bottom center;white-space:nowrap}
.x-name{flex:1;min-width:0;display:flex;align-items:center;gap:var(--gap-inline)}
.x-name .t{min-width:0;font-size:var(--text-base);font-weight:var(--weight-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-row[data-missing="true"] .x-name .t{text-decoration:line-through;color:var(--text-tertiary)}
.badge{flex:none;display:inline-flex;align-items:center;height:19px;padding:0 var(--pad-control-y);border-radius:var(--radius-xs);font-size:var(--text-xs);font-weight:var(--weight-medium)}
.badge.ok{background:var(--success-soft);color:var(--green-600)}
.badge.run{background:var(--accent-soft);color:var(--text-accent)}
.badge.warn{background:var(--warning-soft);color:var(--amber-600)}
.badge.grey{background:var(--surface-active);color:var(--text-tertiary)}
.x-route{width:112px;flex:none;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary)}
.x-size{width:66px;flex:none;text-align:right;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)}
.x-when{width:132px;flex:none;text-align:right;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
.x-foot{flex:none;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0}
.x-foot .summary{flex:1;font-size:var(--text-xs);color:var(--text-tertiary)}

/* ---------- inspector ---------- */
.panel{flex:none;width:0;overflow:hidden;background:var(--surface-sunken);display:flex;flex-direction:column;position:relative;transition:width var(--d-medium) var(--ease)}
.panel[data-open="true"]{width:var(--panel-width,308px);transition-duration:var(--d-slow)}
.panel-in{width:100%;height:100%;display:flex;flex-direction:column;opacity:0;transform:translateX(32px);filter:blur(2px);
  transition:opacity var(--d-medium) var(--ease),transform var(--d-medium) var(--ease),filter var(--d-medium) var(--ease)}
.panel[data-open="true"] .panel-in{opacity:1;transform:none;filter:blur(0);transition-duration:var(--d-slow)}
.panel-resize{position:absolute;top:0;right:0;width:18px;height:100%;cursor:ew-resize;z-index:10;-webkit-app-region:no-drag;touch-action:none}
.panel-resize::after{content:"";position:absolute;top:0;right:0;width:1px;height:100%;background:transparent;transition:background-color var(--d-quick) var(--ease)}
.panel-resize:hover::after,.work[data-resizing="true"] .panel-resize::after{background:var(--accent)}
.work-resize{right:-9px}
.work-resize::after{right:8px}
.work[data-resizing="true"]{overflow:visible;transition:none!important}
#app[data-inspector="false"] .panel-resize{display:none}
body.is-resizing-panel{cursor:ew-resize;user-select:none}
.panel-top{flex:none;height:44px}
.i-sec{flex:none;padding:var(--space-4) 18px;border-bottom:1px solid var(--border-subtle)}
.i-sec b{display:block;font-size:var(--text-base);font-weight:var(--weight-medium);line-height:var(--leading-snug)}
.i-sec .sub{display:block;font-size:var(--text-sm);color:var(--text-secondary);margin-top:var(--space-1)}
.i-sec .mono{display:block;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary);margin-top:var(--space-2)}
.i-file{flex:none;padding:var(--space-4) 18px;border-bottom:1px solid var(--border-subtle);display:flex;gap:var(--space-3);align-items:flex-start}
.i-thumb{width:44px;height:60px;flex:none;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:repeating-linear-gradient(135deg,var(--gray-200) 0 5px,transparent 5px 10px),var(--surface-sunken);display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--space-1);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-tertiary);overflow:hidden}
.i-thumb>span{display:block;transform:scale(.7);transform-origin:bottom center;white-space:nowrap}
.i-route{display:inline-flex;align-items:center;margin-top:var(--space-2);height:22px;padding:0 var(--space-2);border-radius:var(--radius-pill);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);background:var(--accent-soft);color:var(--text-accent)}
.i-body{flex:1;min-height:0;padding:var(--space-4) 18px;display:flex;flex-direction:column;gap:var(--space-4);overflow:auto}
.i-foot{flex:none;padding:var(--space-3) 18px var(--space-4);border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:var(--space-2)}
.i-note{font-size:var(--text-xs);line-height:var(--leading-normal);color:var(--text-tertiary);text-wrap:pretty}
.field label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary);margin-bottom:var(--space-2)}
.field input,.fake-select{width:100%;min-height:32px;padding:var(--pad-control-y) 10px;border:0;border-radius:var(--radius-nav);font-size:var(--text-sm);color:var(--text-primary);background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)}

<script>
'use strict';
const shell = window.appWindow;
const $ = id => document.getElementById(id);

const RANK = {ready:0, helper:1, soon:2};

/* ---------- server ---------- */
async function api(route, body, rerender=true) {

  prevCount = files.length;

  prevHelperDot = dot;

    historyRecords = Array.isArray(data.history) ? data.history : []; render(); }
  catch (error) { showToast(error.message, false); }
}

/* ---------- render ---------- */
function signature() {
  return JSON.stringify([page, selectedId, inspectorOpen, pickerFor, sheetFor, sheetPick, sheetCat, sheetQuery, paletteOpen, query, commandIndex,
    scope, advanced, keepNames, selectedHelper, selectedHistory, histFilter, histSort, [...checked], [...selectedQueueIds], queueAnchorId, historyAnchorId, actionStatus, outputFolder, outputFolders, folderMenuState,
    pendingAdd, countFresh, dotFresh, [...freshRows], [...freshDone], [...freshError],
    files.map(f => [f.id, f.name, f.from, f.to, f.conv, f.status, f.units, f.doneUnits, f.size, f.sourceSize, f.errorTitle, JSON.stringify(f.opts||{})]),

/* ---------- queue ---------- */

function renderQueue() {

    rows.push('<span class="pal-group">Conversions</span>');
    conversions.forEach(t => { rows.push(`<button class="pal-item press ${index === commandIndex ? 'active' : ''}" data-act="palette-conversion" data-id="${esc(t.id)}">
      <span class="g"><span>${esc(t.to)}</span></span><span class="l">${esc(t.label)}</span><span class="s ${routeStateClass(t)}">${routeStateLabel(t)}</span></button>`); index++; });
  }
  if (actions.length) {
    rows.push('<span class="pal-group">Actions</span>');
    actions.forEach(a => { rows.push(`<button class="pal-item press ${index === commandIndex ? 'active' : ''}" data-act="palette-action" data-action="${esc(a.id)}">
      <span class="g"><span>→</span></span><span class="l">${esc(a.label)}</span><span class="s">${esc(a.detail)}</span></button>`); index++; });
  }
  return `<div class="pal-head"><span aria-hidden="true" style="color:var(--text-tertiary)">⌕</span>
      <input id="palInput" data-live="true" placeholder="Search conversions, files, helpers" value="${esc(query)}"><span class="kbd">esc</span></div>
    <div class="pal-body">${rows.join('') || '<div class="pal-empty">No matching commands.</div>'}</div>`;
}

/* ---------- feedback ---------- */
function showToast(title, ok=true, sub='') {
  clearTimeout(toastTimer);
  $('toastTitle').textContent = title;
  $('toastSub').textContent = sub;
  $('toastMark').textContent = ok ? '✓' : '!';
  $('toastMark').classList.toggle('bad', !ok);
  $('toast').dataset.open = 'true';
  toastTimer = setTimeout(() => { $('toast').dataset.open = 'false'; }, 4200);
}
function setActionStatus(next) {
  actionStatus = next; render(true);
  if (next !== 'pending') setTimeout(() => { actionStatus = 'idle'; render(true); }, 1400);
}

/* ---------- actions ---------- */
function wireDrop(zone) {
  if (!zone) return;
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = async e => {
    e.preventDefault(); zone.classList.remove('over');
    pendingAdd = true; render(true);
    try {
    for (const file of [...e.dataTransfer.files]) {
      const source = shell?.getPathForFile?.(file) || file.path || '';
      try {
        if (source) await api('/api/add-path', {path: source});
        else {
          const res = await fetch('/api/upload', {method:'POST', headers:{'X-Filename':encodeURIComponent(file.name), 'X-File-Size':String(file.size)}, body:file});
          if (!res.ok) throw new Error('Upload failed');
          absorb(await res.json());
        }
      } catch (error) { showToast(error.message, false); }
    }
    } finally { pendingAdd = false; render(true); }
  };
}
async function chooseRoute(file, converterId) {
  const targets = scope === 'this' ? [file] : sameKind(file);
  try {
    for (const target of targets) await api('/api/route', {id: target.id, converter: converterId});
    pickerFor = null;
    showToast(targets.length === 1 ? 'Route changed' : `Route changed for ${targets.length} files`);
    render(true);
  } catch (error) { showToast(error.message, false); }
}
async function applyAll() {
  const file = selectedFile(); if (!file) return;
  const targets = sameKind(file);
  try {
    for (const target of targets) {
      if (target.id === file.id) continue;
      for (const key of ['title','creator']) if (file.opts?.[key] !== undefined) await api('/api/update', {id: target.id, key, value: file.opts[key]}, false);
    }
    showToast(`Applied to ${targets.length} files`);
  } catch (error) { showToast(error.message, false); }
}
async function convert() {
  if (actionStatus !== 'idle') return;
  const ready = files.filter(f => f.status === 'idle' && !isBlocked(f)).map(f => f.id);
  if (!ready.length) return;
  setActionStatus('pending');
  try { await api('/api/convert', {ids: ready}); showToast('Conversion started'); }
  catch (error) { setActionStatus('error'); showToast(error.message, false); }
}
async function historyAction(route, body, message) {
  try { await api(route, body); await loadHistory(); showToast(message); }
  catch (error) { showToast(error.message, false); }
}
function setPage(next) {
  page = next; pickerFor = null; sheetFor = null; paletteOpen = false;
  if (next !== 'history') selectedHistory = null;
  if (next === 'helpers' && !selectedHelper) selectedHelper = helperNames()[0] || null;
  if (next === 'history') loadHistory();
  render(true);
}

function dropdownCloseMs() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dropdown-close-dur')) || 150;
}
function openFolderMenu() {
  if (folderMenuTimer) { clearTimeout(folderMenuTimer); folderMenuTimer = null; }
  folderMenuState = 'open';
  render(true);
}
function closeFolderMenu(animate=true) {
  if (folderMenuState === 'closed') return;
  if (folderMenuTimer) clearTimeout(folderMenuTimer);
  if (!animate) { folderMenuState = 'closed'; render(true); return; }
  folderMenuState = 'closing';
  render(true);
  folderMenuTimer = setTimeout(() => { folderMenuState = 'closed'; folderMenuTimer = null; render(true); }, dropdownCloseMs());
}

function contextItem(label, action, icon, options={}) {
  return `<button class="ctx-item ${options.danger ? 'danger' : ''}" data-context-act="${action}" ${options.disabled ? 'disabled' : ''} role="menuitem">
    <span class="ctx-icon" aria-hidden="true">${icon}</span><span>${label}</span>
  </button>`;
}
function contextItems(target) {
  if (target.type === 'queue-file') return [
    contextItem('Select file', 'select-queue', '○'),
    contextItem('Change output format', 'route-queue', '↔', {disabled: target.status === 'queued' || target.status === 'running'}),
    contextItem('Show source in folder', 'reveal-source', '⌁', {disabled: !target.sourcePath}),
    contextItem('Copy source path', 'copy-source', '⧉', {disabled: !target.sourcePath}),
    '<div class="ctx-sep" role="separator"></div>',
    contextItem(target.ids.length > 1 ? `Remove ${target.ids.length} files from queue` : 'Remove from queue', 'remove-queue', '×', {danger: true}),
  ];
  if (target.type === 'history-file') return [
    contextItem('Select output', 'select-history', '○'),
    contextItem('Show in folder', 'reveal-output', '⌁', {disabled: target.state === 'missing'}),
    contextItem('Copy output path', 'copy-output', '⧉', {disabled: !target.outputPath}),
    contextItem(target.ids.length > 1 ? `Convert ${target.ids.length} again` : 'Convert again', 'requeue-history', '↻', {disabled: !target.sourcePath}),
    '<div class="ctx-sep" role="separator"></div>',
    contextItem(target.ids.length > 1 ? `Delete ${target.ids.length} from history` : 'Delete from history', 'delete-history', '×', {danger: true}),
  ];
  return [
    contextItem('Select helper', 'select-helper', '○'),
    contextItem('Check again', 'recheck-helper', '↻'),
    target.url ? contextItem('Open official page', 'open-helper-url', '↗') : '',
  ].filter(Boolean);
}
function contextTargetFromRow(row, x, y) {
  const type = row.dataset.context;
  if (type === 'queue-file') {
    const file = files.find(item => item.id === row.dataset.id);
    return file && {...file, type, ids: [...selectedQueueIds], x, y};
  }
  if (type === 'history-file') {
    const record = historyRecords.find(item => item.id === row.dataset.id);
    return record && {...record, type, ids: [...checked], state: histState(record), x, y};
  }
  const name = row.dataset.helper;
  const data = helperData(name);
  return {type, name, url: data.url || '', x, y};
}
function renderContextMenu() {
  if (!contextTarget) return;
  const label = contextTarget.type === 'helper' ? contextTarget.name : contextTarget.name || contextTarget.sourceName || contextTarget.outputPath || 'File';
  contextMenu.innerHTML = `<div class="ctx-label" title="${esc(label)}">${esc(label)}</div>${contextItems(contextTarget).join('')}`;
  contextMenu.setAttribute('aria-hidden', 'false');
}
function openContextMenu(event, row) {
  closeFolderMenu(false);
  if (row.dataset.context === 'queue-file') {
    if (!selectedQueueIds.has(row.dataset.id)) {
      selectedQueueIds = new Set([row.dataset.id]);
      queueAnchorId = row.dataset.id;
    }
    selectedId = row.dataset.id;
  }
  if (row.dataset.context === 'history-file') {
    if (!checked.has(row.dataset.id)) {
      checked = new Set([row.dataset.id]);
      historyAnchorId = row.dataset.id;
    }
    selectedHistory = row.dataset.id;
  }
  contextTarget = contextTargetFromRow(row, event.clientX, event.clientY);
  if (!contextTarget) return;
  if (contextTarget.type === 'queue-file') contextTarget.ids = [...selectedQueueIds];
  if (contextTarget.type === 'history-file') contextTarget.ids = [...checked];
  if (contextTarget.type === 'helper') selectedHelper = contextTarget.name;
  render(true);
  renderContextMenu();
  contextMenu.style.left = `${event.clientX}px`;
  contextMenu.style.top = `${event.clientY}px`;
  contextMenu.classList.remove('is-closing');
  requestAnimationFrame(() => {
    const gap = 8;
    contextMenu.style.left = `${Math.max(gap, Math.min(event.clientX, window.innerWidth - contextMenu.offsetWidth - gap))}px`;
    contextMenu.style.top = `${Math.max(gap, Math.min(event.clientY, window.innerHeight - contextMenu.offsetHeight - gap))}px`;
    contextMenu.classList.add('is-open');
  });
}
function closeContextMenu(animate=true) {
  if (!contextTarget) return;
  if (contextMenuTimer) clearTimeout(contextMenuTimer);
  contextMenu.classList.remove('is-open');
  if (!animate) {
    contextMenu.classList.remove('is-closing');
    contextMenu.setAttribute('aria-hidden', 'true');
    contextTarget = null;
    return;
  }
  contextMenu.classList.add('is-closing');
  contextMenuTimer = setTimeout(() => {
    contextMenu.classList.remove('is-closing');
    contextMenu.setAttribute('aria-hidden', 'true');
    contextTarget = null;
    contextMenuTimer = null;
  }, dropdownCloseMs());
}
async function handleContextAction(action, target) {
  if (!target) return;
  if (action === 'select-queue' || action === 'route-queue') {
    selectedId = target.id; inspectorOpen = true; pickerFor = action === 'route-queue' ? target.id : null; return render(true);
  }
  if (action === 'reveal-source') return api('/api/reveal', {path: target.sourcePath}, false);
  if (action === 'copy-source') return copyText(target.sourcePath, 'Source path copied');
  if (action === 'remove-queue') { selectedQueueIds = new Set(); queueAnchorId = null; return api('/api/remove-many', {ids: target.ids}); }
  if (action === 'select-history') { selectedHistory = target.id; inspectorOpen = true; return render(true); }
  if (action === 'reveal-output') return api('/api/history/reveal', {path: target.outputPath}, false);
  if (action === 'copy-output') return copyText(target.outputPath, 'Output path copied');
  if (action === 'requeue-history') { const ids = target.ids; checked.clear(); historyAnchorId = null; return historyAction('/api/history/requeue', {ids}, `${ids.length} queued again`); }
  if (action === 'delete-history') { const ids = target.ids; checked.clear(); historyAnchorId = null; return historyAction('/api/history/delete', {ids}, `${ids.length} removed from history`); }
  if (action === 'select-helper') { selectedHelper = target.name; inspectorOpen = true; return render(true); }
  if (action === 'recheck-helper') return api('/api/recheck');
  if (action === 'open-helper-url') return api('/api/open-url', {url: target.url}, false);
}
async function copyText(value, message) {
  if (!value || !navigator.clipboard) return;
  await navigator.clipboard.writeText(value);
  showToast(message);
}

document.addEventListener('pointerdown', event => {
  if (contextTarget && !contextMenu.contains(event.target)) closeContextMenu();
}, true);
document.addEventListener('contextmenu', event => {
  const row = event.target.closest('[data-context]');
  if (!row) { closeContextMenu(); return; }
  event.preventDefault();
  openContextMenu(event, row);
});
document.addEventListener('click', async event => {
  const menuItem = event.target.closest('[data-context-act]');
  if (!menuItem) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const action = menuItem.dataset.contextAct;
  const target = contextTarget;
  closeContextMenu();
  try { await handleContextAction(action, target); }
  catch (error) { showToast(error.message, false); }
});

document.addEventListener('click', async event => {
  if (folderMenuState !== 'closed' && !event.target.closest('.dest')) closeFolderMenu();
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if ((act === 'close-sheet' || act === 'close-palette') && event.target.closest('[data-stop]')) return;

  switch (act) {
    case 'toggle-folder-menu': return folderMenuState === 'open' ? closeFolderMenu() : openFolderMenu();
    case 'select-folder': try { await api('/api/set-folder', {folder: el.dataset.folder}); closeFolderMenu(false); } catch (e) { showToast(e.message, false); } return;
    case 'forget-folder': event.stopPropagation(); try { await api('/api/forget-folder', {folder: el.dataset.folder}); } catch (e) { showToast(e.message, false); } return;
    case 'select-row': return applyQueueSelection(event, el.dataset.id);
    case 'toggle-picker': event.stopPropagation(); selectedId = el.dataset.id;
      pickerFor = pickerFor === el.dataset.id ? null : el.dataset.id; return render(true);
    case 'choose-route': { event.stopPropagation(); const f = files.find(i => i.id === el.dataset.id); if (f) await chooseRoute(f, el.dataset.converter); return; }
    case 'open-sheet': event.stopPropagation(); sheetFor = el.dataset.id;
      sheetPick = files.find(i => i.id === sheetFor)?.to || null; sheetCat = null; sheetQuery = ''; pickerFor = null; return render(true);
    case 'cycle-scope': event.stopPropagation(); scope = scope === 'this' ? 'all' : 'this'; return render(true);
    case 'add': pendingAdd = true; render(true);
      try { await api('/api/pick-files'); } catch (e) { showToast(e.message, false); }
      finally { pendingAdd = false; render(true); } return;
    case 'folder': closeFolderMenu(false); try { await api('/api/pick-folder', {}); showToast('Destination updated'); } catch (e) { showToast(e.message, false); } return;
    case 'remove': event.stopPropagation(); try { await api('/api/remove', {id: el.dataset.id}); } catch (e) { showToast(e.message, false); } return;
    case 'clear': try { await api('/api/clear'); } catch (e) { showToast(e.message, false); } return;
    case 'convert': return convert();
    case 'palette': return openPalette();
    case 'toggle-advanced': advanced = !advanced; return render(true);
    case 'toggle-names': keepNames = !keepNames; return render(true);
    case 'apply-all': return applyAll();
    case 'select-helper': event.stopPropagation(); selectedHelper = el.dataset.helper; inspectorOpen = true; return render(true);
    case 'copy-command': if (navigator.clipboard) { await navigator.clipboard.writeText(el.dataset.command || ''); showToast('Command copied'); } return;
    case 'download-helper': {
      const original = el.textContent; el.disabled = true; el.textContent = 'Downloading…';
      try { await shell.downloadDependency({url: el.dataset.url, name: el.dataset.name}); showToast('Helper downloaded'); }
      catch (error) { showToast(error.message, false); el.disabled = false; el.textContent = original; }
      return;
    }
    case 'recheck': event.stopPropagation(); try { await api('/api/recheck'); showToast('Registry checked again'); } catch (e) { showToast(e.message, false); } return;
    case 'open-url': try { await api('/api/open-url', {url: el.dataset.url}); } catch (e) { showToast(e.message, false); } return;
    case 'history-filter': histFilter = el.dataset.filter; return render(true);
    case 'history-sort': { const order = Object.keys(SORTS); histSort = order[(order.indexOf(histSort) + 1) % order.length]; return render(true); }
    case 'select-history': return applyHistorySelection(event, el.dataset.id);
    case 'check-history': { event.stopPropagation(); const id = el.dataset.id;
      return applyHistorySelection(event, id, true); }
    case 'check-all': { event.stopPropagation(); const rows = visibleHistory();
      const allOn = rows.length > 0 && rows.every(r => checked.has(r.id));
      rows.forEach(r => allOn ? checked.delete(r.id) : checked.add(r.id)); return render(true); }
    case 'history-deselect': checked.clear(); historyAnchorId = null; return render(true);
    case 'history-requeue': { const ids = [...checked]; await historyAction('/api/history/requeue', {ids}, `${ids.length} queued again`); checked.clear(); historyAnchorId = null; return render(true); }
    case 'history-delete': { const ids = [...checked]; await historyAction('/api/history/delete', {ids}, `${ids.length} records deleted`); checked.clear(); historyAnchorId = null; return render(true); }
    case 'requeue-one': return historyAction('/api/history/requeue', {ids: [el.dataset.id]}, 'Queued again');
    case 'reveal-history': try { await api('/api/history/reveal', {path: el.dataset.path}); } catch (e) { showToast(e.message, false); } return;
    case 'close-sheet': sheetFor = null; return render(true);
    case 'sheet-category': sheetCat = el.dataset.category; return render(true);
    case 'sheet-pick': sheetPick = el.dataset.to; return render(true);
    case 'apply-sheet': { const f = sheetFile(); const t = tools.find(i => i.from === f?.from && i.to === sheetPick);
      if (f && t) { await chooseRoute(f, t.id); sheetFor = null; render(true); } return; }
    case 'close-palette': paletteOpen = false; return render(true);
    case 'palette-conversion': { const t = toolMap[el.dataset.id]; if (!t) return;
      page = 'queue'; const f = selectedFile();
      if (f && f.from === t.from) await chooseRoute(f, t.id);
      else showToast(`${t.label} is ${routeStateLabel(t).toLowerCase()}`, t.state === 'ready');
      paletteOpen = false; return render(true); }
    case 'palette-action': { const action = el.dataset.action; paletteOpen = false;
      if (action === 'add') { try { await api('/api/pick-files'); } catch (e) { showToast(e.message, false); } }
      else setPage(action);
      return render(true); }
  }
});

document.addEventListener('input', event => {
  const target = event.target;
  if (target.id === 'palInput') { query = target.value; commandIndex = 0; renderOverlays(); return; }
  if (target.id === 'sheetSearch') { const caret = target.selectionStart; sheetQuery = target.value; renderOverlays();
    const again = $('sheetSearch'); if (again) { again.focus(); again.setSelectionRange(caret, caret); } return; }
  const field = target.closest('[data-act="update-field"]');
  if (field && selectedId) api('/api/update', {id: selectedId, key: field.dataset.key, value: field.value}, false).catch(error => showToast(error.message, false));
});

function openPalette() { paletteOpen = true; query = ''; commandIndex = 0; pickerFor = null; render(true); setTimeout(() => $('palInput')?.focus(), 0); }

document.addEventListener('keydown', event => {
  const key = (event.key || '').toLowerCase();
  if ((event.metaKey || event.ctrlKey) && key === 'k') { event.preventDefault(); paletteOpen ? (paletteOpen = false, render(true)) : openPalette(); return; }
  if (event.altKey && key === 'i') { event.preventDefault(); inspectorOpen = !inspectorOpen; return render(true); }
  if (key === 'escape') { closeContextMenu(); closeFolderMenu(); paletteOpen = false; pickerFor = null; sheetFor = null; return render(true); }
  if (paletteOpen && (key === 'arrowdown' || key === 'arrowup' || key === 'enter')) {
    const items = [...document.querySelectorAll('.pal-item')];
    if (key === 'arrowdown') { commandIndex = Math.min(items.length - 1, commandIndex + 1); event.preventDefault(); renderOverlays(); }
    else if (key === 'arrowup') { commandIndex = Math.max(0, commandIndex - 1); event.preventDefault(); renderOverlays(); }
    else if (items[commandIndex]) { items[commandIndex].click(); event.preventDefault(); }
    return;
  }
  if (key === 'enter' && !paletteOpen && !sheetFor && document.activeElement?.tagName !== 'INPUT' && page === 'queue') { event.preventDefault(); convert(); }
});

document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => setPage(b.dataset.page));
$('searchBtn').onclick = openPalette;
$('themeToggle').onclick = toggleTheme;
$('inspToggle').onclick = () => { inspectorOpen = !inspectorOpen; render(true); };
$('winMin').onclick = () => shell?.minimize?.();
$('winMax').onclick = () => shell?.toggleMaximize?.();
$('winClose').onclick = () => shell?.close?.();

if (shell?.platform) {
  document.body.classList.add(shell.platform === 'darwin' ? 'is-mac' : 'is-electron');
  shell.onState?.(state => {
    const icon = $('winMaxIcon');
    if (icon) icon.innerHTML = state.maximized
      ? '<path d="M2.5 2.5h6v6h-6z"/><path d="M1.5 1.5h6v1"/>'
      : '<rect x=".5" y=".5" width="9" height="9"/>';
  });
  shell.onUpdateState?.(() => {});
}

Promise.all([
  fetch('/api/tools').then(r => r.json()),
  fetch('/api/state').then(r => r.json()),
]).then(([toolData, state]) => { setTools(toolData.tools || []); absorb(state); })
  .catch(error => showToast(error.message, false));

setInterval(async () => {
  try { const res = await fetch('/api/state'); absorb(await res.json()); }
  catch { /* server may be restarting */ }
}, 700);
</script>
</body>
</html>
