<title>One Tool</title>
<style>
/* One Tool tokens. This surface follows the prototype, not the web workspace system. */

:root {
  /* colours */
  --gray-0:#FFFFFF; --gray-50:#FAFAFA; --gray-100:#F4F4F4; --gray-200:#EBEBEB;
  --gray-300:#E0E0E0; --gray-400:#C7C7C7; --gray-500:#9E9E9E; --gray-600:#5D5D5D; --gray-900:#292929;
  --blue-50:#EEF3FE; --blue-100:#D7E4FD; --blue-500:#2C6EF5; --blue-600:#1F5AD8; --blue-700:#1A4CB8;
  --green-50:#E9F6EE; --green-500:#2E9E5B; --green-600:#248049;
  --amber-50:#FBF2E1; --amber-500:#C9820A; --amber-600:#A66A07;
  --red-50:#FCECEC; --red-500:#DC3B3B; --red-600:#BE2E2E;

  --text-primary:var(--gray-900); --text-secondary:var(--gray-600); --text-tertiary:var(--gray-500);
  --text-inverse:var(--gray-0); --text-accent:var(--blue-600); --text-disabled:var(--gray-400);
  --surface-page:var(--gray-0); --surface-card:var(--gray-0); --surface-sunken:var(--gray-100);
  --surface-hover:var(--gray-100); --surface-active:var(--gray-200); --surface-inverse:var(--gray-900);
  --border-subtle:var(--gray-200); --border-default:var(--gray-300); --border-strong:var(--gray-400);
  --border-focus:var(--blue-500);
  --accent:var(--blue-500); --accent-hover:var(--blue-600); --accent-active:var(--blue-700); --accent-soft:var(--blue-50);
  --success:var(--green-500); --success-soft:var(--green-50);
  --warning:var(--amber-500); --warning-soft:var(--amber-50);
  --danger:var(--red-500); --danger-hover:var(--red-600); --danger-soft:var(--red-50);
  --ring:0 0 0 3px var(--blue-100);

  /* type — only four sizes exist */
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Monaco,monospace;
  --weight-regular:400; --weight-medium:500;
  --text-xs:12px; --text-sm:13px; --text-base:14px; --text-2xl:24px;
  --leading-tight:1.25; --leading-snug:1.35; --leading-normal:1.5;
  --tracking:-0.15px;

  /* spacing — 4px grid */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --pad-control-x:12px; --pad-control-y:7px; --pad-card:16px; --gap-nav:4px; --gap-inline:8px;

  /* radii */
  --radius-xs:4px; --radius-nav:8px; --radius-card:16px; --radius-pill:9999px;

  /* elevation */
  --shadow-none:none;
  --shadow-card:0 1px 2px rgba(41,41,41,.05),0 1px 3px rgba(41,41,41,.04);
  --shadow-raised:0 4px 12px rgba(41,41,41,.08),0 1px 3px rgba(41,41,41,.05);
  --shadow-popover:0 8px 24px rgba(41,41,41,.12),0 2px 6px rgba(41,41,41,.06);
  --shadow-modal:0 24px 64px rgba(41,41,41,.18),0 8px 20px rgba(41,41,41,.08);

  /* Motion — the transitions.dev scale from Motion Showcase.dc.html.
     Fidelio's 120-160ms guidance is scoped to background/border/opacity hover states,
     which is --d-quick below. Structural motion (panel, page, modal, popover, toast)
     uses the showcase scale, or a 308px panel slide reads as a jump rather than a move.
     Three rules: opens are slower than closes; reversible motions are symmetric;
     overshoot is for entrances only. */
  --d-quick:150ms; --d-fast:250ms; --d-medium:350ms; --d-slow:400ms; --d-vslow:500ms; --stagger:50ms;
  --ease:cubic-bezier(.22,1,.36,1); --ease-bounce:cubic-bezier(.34,1.36,.64,1); --ease-spring:cubic-bezier(.34,1.45,.64,1);
  --ease-inout:cubic-bezier(.4,0,.2,1);
  --scrim:rgba(41,41,41,.32);
}

@media (prefers-contrast:more){
  :root{--border-subtle:var(--gray-400);--border-default:var(--gray-500);--text-secondary:#3d3d3d;--text-tertiary:#5d5d5d}
}

/* Prototype token block: keep these values verbatim so the renderer and the design
   reference share the same native desktop scale. The compatibility aliases below
   keep the backend-connected renderer class names readable without changing the
   visual source of truth. */
:root{
  --bg:#f2f2f4;--surface:#ffffff;--raised:#ffffff;
  --quiet:rgba(60,60,67,.055);--quiet2:rgba(60,60,67,.10);--quiet3:rgba(60,60,67,.15);
  --sep:rgba(60,60,67,.13);--sep2:rgba(60,60,67,.24);
  --t1:#1d1d1f;--t2:rgba(60,60,67,.72);--t3:rgba(60,60,67,.52);--t4:rgba(60,60,67,.34);
  --acc:#0b6bcb;--acc-h:#0a5fb5;--acc-text:#0b6bcb;--acc-tint:rgba(11,107,203,.10);--acc-tint2:rgba(11,107,203,.18);
  --ok:#2f9e57;--ok-t:#1a7a41;--ok-tint:rgba(47,158,87,.12);
  --warn:#e08600;--warn-t:#8a5300;--warn-tint:rgba(224,134,0,.12);
  --dang:#e0483e;--dang-t:#b3261e;--dang-tint:rgba(224,72,62,.10);
  --sh1:0 1px 2px rgba(0,0,0,.06);--sh2:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.08);
  --sh3:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16);
  --stripe:rgba(60,60,67,.10);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Helvetica Neue",Helvetica,sans-serif;
  --page:#e8e6e1;
  --d-quick:150ms;--d-fast:250ms;--d-medium:350ms;--d-slow:400ms;--d-vslow:500ms;--d-stagger:50ms;
  --ease:cubic-bezier(.22,1,.36,1);--ease-bounce:cubic-bezier(.34,1.36,.64,1);--ease-spring:cubic-bezier(.34,1.45,.64,1);
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:var(--t1);
  --text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-inverse:#fff;--text-accent:var(--acc-text);--text-disabled:var(--t4);
  --border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--border-focus:var(--acc);
  --accent:var(--acc);--accent-hover:var(--acc-h);--accent-active:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);
  --font-sans:var(--ui);--font-mono:var(--mono);--weight-regular:400;--weight-medium:500;
  --text-xs:11px;--text-sm:12px;--text-base:13px;--text-2xl:25px;--leading-tight:1.25;--leading-snug:1.35;--leading-normal:1.5;--tracking:-.018em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --pad-control-x:12px;--pad-control-y:7px;--pad-card:16px;--gap-nav:4px;--gap-inline:8px;
  --radius-xs:5px;--radius-nav:8px;--radius-card:14px;--radius-pill:999px;
  --shadow-card:var(--sh1);--shadow-raised:var(--sh2);--shadow-popover:var(--sh2);--shadow-modal:var(--sh3);--scrim:rgba(20,20,22,.32);
  --dropdown-open-dur:250ms;--dropdown-close-dur:150ms;--dropdown-pre-scale:.97;--dropdown-closing-scale:.99;--dropdown-ease:cubic-bezier(.22,1,.36,1);
  --gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}
[data-theme="dark"]{
  --bg:#131315;--surface:#1c1c1f;--raised:#232326;--quiet:rgba(235,235,245,.06);--quiet2:rgba(235,235,245,.11);--quiet3:rgba(235,235,245,.16);--sep:rgba(235,235,245,.11);--sep2:rgba(235,235,245,.22);--t1:#f5f5f7;--t2:rgba(235,235,245,.70);--t3:rgba(235,235,245,.48);--t4:rgba(235,235,245,.30);--acc:#2b7fff;--acc-h:#4d9bff;--acc-text:#7fbaff;--acc-tint:rgba(43,127,255,.16);--acc-tint2:rgba(43,127,255,.28);--ok:#30d158;--ok-t:#5cd97e;--ok-tint:rgba(48,209,88,.14);--warn:#ff9f0a;--warn-t:#ffb545;--warn-tint:rgba(255,159,10,.14);--dang:#ff453a;--dang-t:#ff7d74;--dang-tint:rgba(255,69,58,.14);--page:#0a0a0b;
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:#1f2024;--text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-disabled:var(--t4);--border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--accent:var(--acc);--accent-hover:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);--gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}
[data-theme="dark"]{
  --bg:#000000;--surface:#000000;--raised:#000000;--quiet:rgba(237,237,237,.06);--quiet2:rgba(237,237,237,.11);--quiet3:rgba(237,237,237,.16);--sep:rgba(237,237,237,.12);--sep2:rgba(237,237,237,.24);--t1:#ededed;--t2:rgba(237,237,237,.70);--t3:rgba(237,237,237,.50);--t4:rgba(237,237,237,.32);--acc:#006efe;--acc-h:#2b80ff;--acc-text:#006efe;--acc-tint:rgba(0,110,254,.18);--acc-tint2:rgba(0,110,254,.30);--ok:#00ad3a;--ok-t:#2bd466;--ok-tint:rgba(0,173,58,.16);--warn:#ffad1f;--warn-t:#ffc15c;--warn-tint:rgba(255,173,31,.16);--dang:#f13342;--dang-t:#ff6874;--dang-tint:rgba(241,51,66,.16);--page:#000000;
  --ui:"Geist",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --surface-page:var(--page);--surface-card:var(--surface);--surface-sunken:var(--bg);--surface-hover:var(--quiet);--surface-active:var(--quiet2);--surface-inverse:var(--t1);--text-primary:var(--t1);--text-secondary:var(--t2);--text-tertiary:var(--t3);--text-disabled:var(--t4);--border-subtle:var(--sep);--border-default:var(--sep2);--border-strong:var(--t3);--accent:var(--acc);--accent-hover:var(--acc-h);--accent-soft:var(--acc-tint);--success:var(--ok);--success-soft:var(--ok-tint);--warning:var(--warn);--warning-soft:var(--warn-tint);--danger:var(--dang);--danger-hover:var(--dang-t);--danger-soft:var(--dang-tint);--gray-0:var(--surface);--gray-200:var(--quiet2);--gray-300:var(--sep2);--gray-400:var(--t3);--green-600:var(--ok-t);--amber-600:var(--warn-t);--blue-100:var(--acc-tint2);
}

*{box-sizing:border-box}
html,body{height:100%}
html{font-family:var(--font-sans);letter-spacing:var(--tracking);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{margin:0;overflow:hidden;background:var(--surface-sunken);color:var(--text-primary);font-size:var(--text-base);font-weight:var(--weight-regular)}
html,body,*{-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
button,input{font:inherit;letter-spacing:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
[hidden]{display:none!important}
[disabled]{cursor:default}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:var(--radius-xs)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* scrollbars are ours, never the platform's */
*{scrollbar-width:thin;scrollbar-color:var(--border-default) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-default);background-clip:content-box;border:3px solid transparent;border-radius:var(--radius-pill);min-height:32px;transition:background-color var(--d-quick) var(--ease)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);background-clip:content-box}
::-webkit-scrollbar-thumb:active{background:var(--text-tertiary);background-clip:content-box}

/* ---------- motion primitives ---------- */
.press{transition:transform var(--d-quick) var(--ease),background-color var(--d-quick) var(--ease),box-shadow var(--d-quick) var(--ease),color var(--d-quick) var(--ease)}
.press:active:not([disabled]){transform:scale(.97)}
/* The chevron is a drawn path rather than a text glyph, so it turns through its
   own centre instead of the font's baseline box, and needs no corrective scale. */
.chev{display:inline-grid;place-items:center;width:12px;height:12px;flex:none;color:var(--text-tertiary);
  transition:transform var(--d-fast) var(--ease)}
.chev svg{display:block}
.chev[data-flipped="true"]{transform:rotate(180deg)}
.row{transition:background-color var(--d-fast) var(--ease),opacity var(--d-fast) var(--ease)}
.row:hover{background:var(--surface-hover)}
.bar-fill{transition:width var(--d-fast) linear}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.pulse{animation:pulse 1.1s ease-in-out infinite}

/* Entrance tier. Fidelio's 120-160ms band covers hover/press state changes; an element
   arriving on screen needs slightly longer to be legible. 240ms is the ceiling, and no
   entrance overshoots — the system forbids bounce. */
@keyframes row-in{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
.q-row.is-new{animation:row-in var(--d-slow) var(--ease) backwards}

/* success check — scale in, then draw the stroke */
@keyframes tick-in{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes tick-draw{to{stroke-dashoffset:0}}
.tick.is-fresh{animation:tick-in var(--d-vslow) var(--ease-bounce) both}
.tick.is-fresh svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:tick-draw var(--d-vslow) var(--ease) 80ms both}

/* queue count pop-in */
@keyframes digit-in{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
.digit{display:inline-block}
.digit.is-fresh{animation:digit-in var(--d-vslow) var(--ease-spring) both}

/* a file that cannot be read — a nudge, not a flourish */
@keyframes shake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}100%{transform:none}}
.q-row.is-error{animation:shake 240ms var(--ease) both}

/* indeterminate work only — where an honest page count genuinely does not exist */
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.status.indeterminate{background:linear-gradient(100deg,var(--text-secondary) 30%,var(--text-primary) 50%,var(--text-secondary) 70%);
  background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}

/* helpers badge */
@keyframes badge-in{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.navdot.is-fresh{animation:badge-in var(--d-medium) var(--ease-bounce) both}

/* skeleton shown while a pick/drop is in flight */
.skel{position:absolute;inset:0;z-index:2;border-radius:var(--radius-card);background:var(--surface-card);overflow:hidden;
  transition:opacity var(--d-slow) var(--ease)}
.skel[data-done="true"]{opacity:0;pointer-events:none}
.skel-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle)}
.skel-b{display:block;border-radius:var(--radius-xs);background:var(--surface-active)}

/* ---------- app shell ---------- */
.app{height:100%;min-width:760px;display:flex;flex-direction:column;position:relative}

.topbar{height:44px;flex:none;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);-webkit-app-region:drag;user-select:none;position:relative;z-index:12;
  container:topbar / inline-size;
  transition:padding-right var(--d-slow) var(--ease)}
/* when the inspector is closed the window controls sit over the bar's right end,
   so the bar yields the space; when it is open they sit over the panel instead */
.app[data-inspector="false"] .topbar{padding-right:116px;transition-duration:var(--d-medium)}
body.is-mac .topbar{padding-left:82px}
.topbar button,.wincontrols{-webkit-app-region:no-drag}
.nav{display:flex;align-items:center;gap:var(--space-4);flex:none}
.navbtn{position:relative;min-height:26px;padding:0 9px;border-radius:var(--radius-nav);font-size:var(--text-sm);font-weight:var(--weight-regular);color:var(--text-secondary);transition:background-color var(--d-quick) var(--ease),color var(--d-quick) var(--ease)}
.navbtn:hover{background:var(--surface-hover)}
.navbtn.active{background:var(--accent);color:var(--text-inverse);font-weight:var(--weight-medium)}
.navdot{position:absolute;top:2px;right:1px;width:7px;height:7px;border-radius:var(--radius-pill);background:var(--warning);box-shadow:0 0 0 2px var(--surface-sunken)}
.searchwrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
.theme-host{flex:none;position:relative;display:flex;align-items:center}
.theme-toggle{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-nav);-webkit-app-region:no-drag}
.theme-toggle:hover{background:var(--surface-hover)}
.theme-logo{display:block;width:19px;height:19px;background:var(--text-secondary);-webkit-mask:url('/fidelioB.svg') center/contain no-repeat;mask:url('/fidelioB.svg') center/contain no-repeat;transition:background-color var(--d-quick) var(--ease),-webkit-mask-image var(--d-quick) var(--ease)}
[data-theme="dark"] .theme-logo{background:var(--text-primary);-webkit-mask-image:url('/fidelioW.svg');mask-image:url('/fidelioW.svg')}
.theme-toggle.is-spinning .theme-logo{animation:theme-spin 520ms var(--ease) both}
@keyframes theme-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.theme-host .tip{left:0;right:auto}
.search{display:flex;align-items:center;gap:var(--gap-inline);width:330px;max-width:100%;min-width:0;height:28px;padding:0 10px;border-radius:var(--radius-nav);background:var(--surface-hover);font-size:var(--text-sm);color:var(--text-tertiary);
  transition:background-color var(--d-quick) var(--ease),width var(--d-fast) var(--ease),padding var(--d-fast) var(--ease)}
.search:hover{background:var(--surface-active)}
/* The label never wraps: a second line would grow the control past the bar's
   fixed height. It truncates while there is still something worth reading, and
   below that the control collapses to its glyph rather than showing a sliver.
   The query is on the bar, not the viewport, because the inspector's width is
   what squeezes this — the window can be wide while the bar is narrow. */
.search .label{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .kbd,.search > [aria-hidden="true"]{flex:none}
@container topbar (max-width:560px){.search .kbd{display:none}}
@container topbar (max-width:400px){
  .search{width:28px;padding:0;justify-content:center}
  .search .label{display:none}
}
.kbd{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);padding:2px 5px;border-radius:var(--radius-xs);background:var(--surface-active);color:var(--text-tertiary)}
.tiphost{position:relative}
.insp-toggle{width:30px;height:26px;display:grid;place-items:center;border-radius:var(--radius-nav);color:var(--text-secondary)}
.insp-toggle:hover{background:var(--surface-hover)}
.insp-toggle.on{background:var(--accent);color:var(--text-inverse)}
#app[data-inspector="true"] .insp-toggle{background:var(--accent);color:var(--text-inverse)}
.tip{position:absolute;top:32px;right:0;display:flex;align-items:center;gap:var(--space-2);padding:5px 9px;border-radius:var(--radius-nav);background:var(--surface-inverse);color:var(--text-inverse);font-size:var(--text-xs);font-weight:var(--weight-medium);white-space:nowrap;box-shadow:var(--shadow-popover);opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity var(--d-quick) ease-out,transform var(--d-quick) ease-out;z-index:5}
[data-theme="dark"] .tip{background:#1f2024;color:#ededed}
.tiphost:hover .tip{opacity:1;transform:none;transition-delay:80ms}
.tip .kbd{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.topbar>.tiphost{flex:none}

/* ---------- One Tool prototype geometry ---------- */
html{background:var(--page)}

.page{transform:translateX(var(--px,8px));filter:blur(3px);transition:opacity 250ms var(--ease),transform 250ms var(--ease),filter 250ms var(--ease)}

@keyframes p-cascade{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes p-pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes p-panel{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes p-page{from{opacity:0;transform:translateX(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes p-pop{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}

@keyframes p-shimmer{from{background-position:150% 0}to{background-position:-50% 0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  /* Drop the travel, keep the signal. Anything that carried meaning through motion alone
     falls back to a static colour rather than freezing mid-animation. */
  .status.indeterminate{background:none;color:var(--text-secondary);-webkit-text-fill-color:var(--text-secondary)}
  .pulse{opacity:.65}
  .tick.is-fresh svg path{stroke-dasharray:none;stroke-dashoffset:0}
  .spin{border-top-color:var(--text-inverse)}
}

/* A narrow window belongs to the list. The inspector is the thing that gives
   way — it used to take the whole window and hide the list entirely. */
@media (max-width:640px){.app{min-width:0}.panel[data-open="true"]{width:0}.panel-resize{display:none}}

/* ---------- settings ----------
   Ported from the One Tool Settings 4a prototype: a sidebar of categories beside a
   scrolling pane of sections. Helpers is a category here, not a page of its own, so
   the installer list lives inside the same shell as every other preference. */
/* The cog is its own two-tone icon rather than a theme token: grey on light,
   near-white on dark, at the weights the handoff specifies. */
:root{--cog:#6E6E74}
[data-theme="dark"]{--cog:#EDEDED}
.cog-btn{display:inline-flex;position:relative;background:none;border:0;padding:0;cursor:pointer;width:24px;height:24px;flex:none;color:var(--cog);-webkit-app-region:no-drag}
.cog-btn svg{width:100%;height:100%;display:block;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.33,1,.68,1)}
.cog-btn:hover svg,.cog-btn:focus-visible svg{transform:rotate(45deg)}
.cog-btn .navdot{top:-1px;right:-2px}
@media (prefers-reduced-motion:reduce){.cog-btn svg{transition:none}.cog-btn:hover svg{transform:none}}

/* Settings is a sheet over the app, not a place you navigate to — the work behind
   it stays put and the window closes back onto exactly what you left. */
/* The sheet covers the whole window, title bar and inspector included, so nothing
   behind it stays clickable while it is up. */
.set-scrim{position:fixed;z-index:40;align-items:center;padding:0}
.set-win{display:flex;flex-direction:row;width:940px;max-width:calc(100% - 48px);height:660px;max-height:calc(100% - 48px);border-radius:14px;background:var(--bg)}
.set-side{width:236px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--sep);min-height:0}
.set-search{flex:none;padding:12px 12px 10px}
.set-search-in{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--sep2)}
.set-search-in span{font-size:12px;color:var(--t3)}
.set-search-in input{flex:1;min-width:0;border:0;outline:none;background:none;font:400 12px var(--ui);color:var(--t1)}
.set-tabs{flex:1;min-height:0;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.set-tabs .col{padding:6px 8px 4px}
.col{font:600 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
.set-tab{min-height:30px;padding:0 9px;display:flex;align-items:center;gap:10px;border-radius:8px;font:500 12.5px var(--ui);color:var(--t2);background:none;text-align:left}
.set-tab:hover{background:var(--quiet)}
.set-tab[data-on="true"]{background:var(--quiet2);color:var(--t1);font-weight:600}
.set-tab .g{width:16px;text-align:center;font-size:12px;opacity:.9;flex:none}
.set-tab .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-tab .pill{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--warn-tint);color:var(--warn-t);font:600 10px var(--ui);text-align:center;line-height:16px;flex:none}
.set-ver{padding:10px 14px;border-top:1px solid var(--sep);font:400 11px var(--mono);color:var(--t4)}

.set-main{flex:1;min-width:0;display:flex;flex-direction:column}
.set-head{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 24px;font-size:12.5px;font-weight:600;color:var(--t2)}
.set-close{flex:none;min-height:26px;padding:0 9px;color:var(--t3);font-size:11px;box-shadow:none}
.set-close:hover{background:var(--quiet);color:var(--t1)}
.set-pane{flex:1;min-height:0;overflow:auto;padding:0 24px 40px}
/* The Settings DC fades at 200ms ease, and only when something actually arrives. */
.s-fade{animation:fadeIn 200ms ease backwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.set-sec-t{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:22px 0 6px}
.set-row{display:flex;align-items:center;gap:20px;padding:14px 0;border-top:1px solid var(--sep)}
.set-row .lab{font-size:12.5px;font-weight:500}
.set-row .sub{font-size:11.5px;line-height:1.45;color:var(--t3);margin-top:2px}
.set-empty{padding:40px;text-align:center;font-size:12.5px;color:var(--t3)}

.sw{width:38px;height:22px;flex:none;border-radius:999px;padding:2px;display:flex;background:var(--sep2);justify-content:flex-start;transition:background 160ms ease;cursor:pointer}
.sw[data-on="true"]{background:var(--acc);justify-content:flex-end}
.sw i{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform 160ms var(--ease)}
.set-selwrap{position:relative;flex:none}
.sel{height:26px;padding:0 9px;display:flex;align-items:center;gap:8px;border-radius:7px;font:500 12px var(--ui);color:var(--t1);box-shadow:inset 0 0 0 1px var(--sep2);background:var(--surface)}
.sel .car{font-size:8px;color:var(--t3)}
.set-menu{position:absolute;right:0;top:30px;z-index:30;min-width:168px;padding:4px;border-radius:9px;background:var(--surface);box-shadow:var(--sh2),0 0 0 1px var(--sep);display:flex;flex-direction:column;gap:1px}
.set-menu button{min-height:28px;padding:0 8px;display:flex;align-items:center;gap:8px;border-radius:6px;font:400 12px var(--ui);color:var(--t1);text-align:left}
.set-menu button:hover{background:var(--quiet)}
.set-menu button[data-on="true"]{font-weight:600;background:var(--quiet)}
.set-menu .tk{width:11px;font-size:10px;color:var(--acc-text);flex:none}
.set-menu .nm{flex:1;white-space:nowrap}

.set-hhead{padding:6px 0 18px;border-bottom:1px solid var(--sep)}
.set-hhead-row{display:flex;align-items:center;gap:14px}
.set-hhead-row b{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.set-hblurb{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--t3);max-width:68ch;text-wrap:pretty}
.set-hlist{display:flex;flex-direction:column;padding-top:4px}
.set-h{border-bottom:1px solid var(--sep)}
.set-h-top{width:100%;display:flex;align-items:center;gap:12px;padding:13px 8px 13px 2px;border-radius:8px;text-align:left;cursor:pointer}
.set-h-top:hover{background:var(--quiet)}
.set-h-chev{width:10px;text-align:center;font-size:11px;color:var(--t4);flex:none}
.set-h-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--warn)}
.set-h-dot[data-state="ok"]{background:var(--ok)}
.set-h-dot[data-state="busy"]{background:var(--acc)}
.set-h-name{flex:1;min-width:0}
.set-h-name b{display:block;font:600 12.5px var(--mono)}
.set-h-name span{display:block;font-size:11.5px;color:var(--t3);margin-top:2px}
.set-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:500 11px var(--ui);background:var(--warn-tint);color:var(--warn-t);flex:none}
.set-chip[data-state="ok"]{background:var(--ok-tint);color:var(--ok-t)}
.set-chip[data-state="busy"]{background:var(--acc-tint);color:var(--acc-text)}
.set-h-body{padding:2px 8px 18px 29px;display:flex;flex-direction:column;gap:12px}
.set-h-grp{display:flex;flex-direction:column;gap:6px}
.set-h-chips{display:flex;flex-wrap:wrap;gap:6px}
.set-h-chips span{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;background:var(--quiet);font:500 11px var(--mono);color:var(--t3)}
.set-h[data-installed="true"] .set-h-chips span{color:var(--t2)}
.set-cmd{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 11px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--sep2)}
.set-cmd code{flex:1;min-width:0;font:400 11.5px var(--mono);color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-copy{flex:none;color:var(--acc-text);font-weight:500}
.set-copy:hover{background:var(--acc-tint)}
@media (prefers-reduced-motion:reduce){.s-fade{animation-duration:1ms}}

/* ---------- editor and creator ----------
   Both screens come from their prototypes; the values below are the prototype's,
   with the fixed canvas size traded for the app's flexible window. */
:root{--paper:#fdfdfd;--ink:rgba(60,60,67,.16)}
[data-theme="dark"]{--paper:#151517;--ink:rgba(237,237,237,.18)}

/* Both screens are a window field with cards floating in it, so the page is the
   sunken colour and the white card reads as a card rather than as the page. */
#pageEditor,#pageCreator{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--bg)}
.wk-row{flex:1;min-height:0;display:flex}
.wk-card{border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--sep),var(--sh2);display:flex;flex-direction:column;overflow:hidden;min-width:0}
/* The workspace itself is already a card. A screen that fills it uses this
   instead, so its header sits on the workspace — the way Convert's does —
   and only its inner list reads as a card. */
.wk-plain{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.wk-h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.018em}
.wk-sub{margin:4px 0 0;font-size:12.5px;color:var(--t2)}
/* The workspace panes are the same inspector as the Convert panel, so they take
   the same width and the same collapse. Their handle is a static sibling rather
   than an absolute overlay, because there is no card edge here to sit on. */
.wk-side{width:var(--panel-width,308px);flex:none;display:flex;flex-direction:column;overflow:auto;
  transition:opacity var(--d-fast) var(--ease)}
/* Inside the app's side panel the pane is the panel: it takes its width from it
   rather than setting its own, so one resize handle drives both. */
.wk-side[data-inline="true"]{width:auto;flex:1;min-height:0}
.wk-resize{position:relative;flex:none;width:10px;margin:0 -5px;align-self:stretch;cursor:ew-resize;z-index:10;
  -webkit-app-region:no-drag;touch-action:none}
/* Past the collapse point the pane stops rendering as a pane: it blanks, rather
   than clipping its rows into an unreadable column. */
.wk-side[data-collapsed="true"]{opacity:0;pointer-events:none}
.panel[data-collapsed="true"] .panel-in{opacity:0;pointer-events:none}
.pbtn{min-height:28px;padding:0 12px;display:flex;align-items:center;gap:7px;border-radius:8px;font:600 12px var(--ui);color:var(--t2);box-shadow:inset 0 0 0 1px var(--sep2);transition:background var(--d-quick) ease}
.pbtn:hover{background:var(--quiet)}
.pbtn.pri{background:var(--acc);color:#fff;box-shadow:none;min-height:30px;font-size:12.5px}
.pbtn.pri:hover{background:var(--acc-h)}
.pbtn.gh{box-shadow:none;font-weight:500}
.pbtn.gh:hover{background:var(--acc-tint)}
.pbtn.off{opacity:.4;pointer-events:none}
.pchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:500 11px var(--ui)}
.eyebrow-p{font:600 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
.pseg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--quiet)}
.pseg button{flex:1;min-height:24px;display:grid;place-items:center;border-radius:6px;font:500 11.5px var(--ui);color:var(--t2);transition:background var(--d-quick) ease}
.pseg button[data-on="true"]{font-weight:600;color:var(--t1);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ptile{flex:none;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font:600 6.5px var(--mono);color:var(--t3);background:var(--quiet2);box-shadow:inset 0 0 0 1px var(--sep);overflow:hidden}
.ptile.acc{background:var(--acc);color:#fff;box-shadow:none}
.pkv{display:flex;justify-content:space-between;font-size:12px}
.pkv .k{color:var(--t2)}
.pkv .v{font:500 12px var(--mono);color:var(--t1)}

/* pages */
.pg{background:var(--paper);border-radius:3px;box-shadow:0 0 0 1px var(--sep),0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:4px;padding:9px 8px;overflow:hidden;transition:box-shadow var(--d-quick) ease,transform 200ms var(--ease)}
.ln{height:3px;border-radius:2px;background:var(--ink);flex:none}
.pthumb{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;transition:opacity var(--d-quick) ease}
.pthumb:hover .pg{box-shadow:0 0 0 1px var(--sep2),0 3px 10px rgba(0,0,0,.10)}
.pthumb[data-on="true"] .pg{box-shadow:0 0 0 2px var(--acc),0 1px 2px rgba(0,0,0,.06)}
.pthumb[data-dim="true"]{opacity:.8}
.pthumb-box{width:100%;aspect-ratio:.72;display:flex;align-items:center;justify-content:center}
.tcap{font:500 11px var(--mono);color:var(--t3)}
.pthumb[data-on="true"] .tcap{color:var(--acc-text);font-weight:600}
.pthumb-add{width:100%;aspect-ratio:.72;border-radius:3px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--sep2);color:var(--t3);font-size:18px}
.ed-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 18px}
.ed-pairgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.ed-drop{width:100%;aspect-ratio:.72;border-radius:3px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--acc-tint2);background:var(--acc-tint);font:600 11px var(--ui);color:var(--acc-text);text-align:center;padding:6px}

/* editor chrome */
.ed-selbar{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--sep);background:var(--acc-tint)}
.ed-selbar .n{font-size:12.5px;font-weight:600;color:var(--acc-text)}
.ed-selbar .rule{width:1px;height:16px;background:var(--acc-tint2)}
.ed-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep)}
.ed-foot{flex:none;display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--sep)}
.ed-rail{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.tool{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--t2);font-size:13px;transition:background var(--d-quick) ease,color var(--d-quick) ease}
.tool:hover{background:var(--quiet)}
.tool[data-on="true"]{background:var(--acc-tint);color:var(--acc-text)}
.ed-railrule{width:22px;height:1px;background:var(--sep);margin:6px 0}
.ed-toolbar{flex:none;display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--sep);background:var(--surface)}
.ed-toolbar .rule{width:1px;height:16px;background:var(--sep)}
.ed-num{font:400 12px var(--mono);text-align:center}
.ed-canvaswrap{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;background:var(--bg)}
.ed-canvas{aspect-ratio:.72;flex:none;justify-content:flex-start;padding:34px 30px;gap:9px;position:relative}
.ed-canvas[data-redact="true"]{cursor:crosshair}
.ed-canvas .ln{height:4px}
.ed-mark{position:absolute;border-radius:2px;background:#1d1d1f;box-shadow:0 0 0 2px var(--acc-tint2);animation:fadeIn var(--d-fast) ease backwards}
.ed-pageno{position:absolute;left:30px;bottom:20px;font:500 10px var(--mono);color:var(--t4)}
.ed-strip{flex:none;background:var(--surface);border-top:1px solid var(--sep);padding:9px 12px;display:flex;align-items:center;gap:9px;overflow:auto}
.strip{width:46px;height:62px;flex:none;background:var(--paper);border-radius:2px;box-shadow:0 0 0 1px var(--sep);display:flex;flex-direction:column;gap:2px;padding:5px 4px;overflow:hidden;transition:box-shadow var(--d-quick) ease}
.strip[data-on="true"]{box-shadow:0 0 0 2px var(--acc)}
.strip .ln{height:2px}
.ed-mark-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--sep2)}
.ed-mark-sw{width:22px;height:12px;flex:none;border-radius:2px;background:#1d1d1f}
.ed-empty-marks{padding:12px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--sep2);font-size:12px;color:var(--t3);line-height:1.5}
.ed-edits{margin-top:auto;padding-top:12px;border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:5px}
.ed-edit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.ed-edit .d{width:5px;height:5px;flex:none;border-radius:50%;background:var(--acc)}
.ed-edit .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-mid{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ed-mid .pbtn{width:76px;justify-content:center}
.ed-mid .rule{width:44px;height:1px;background:var(--sep2);margin:6px 0}
.ed-mid .hint{font-size:11px;line-height:1.5;color:var(--t3);text-align:center;padding:0 6px}
.ed-dropover{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--page) 72%,transparent);pointer-events:none}
.ed-dropcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 34px;border-radius:16px;background:var(--surface);box-shadow:var(--sh3),inset 0 0 0 1.5px var(--acc-tint2)}

/* creator */
.cr-pickhead{flex:none;display:flex;align-items:flex-end;gap:12px;padding:16px 20px 13px;border-bottom:1px solid var(--sep)}
.cr-groups{flex:1;min-height:0;overflow:auto;padding:14px 20px 0}
.cr-grouphead{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.cr-grouphead .rule{flex:1;height:1px;background:var(--sep)}
.cr-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:16px}
.fcell{padding:12px 13px;border-radius:11px;display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;box-shadow:inset 0 0 0 1px var(--sep2);transition:background var(--d-quick) ease,box-shadow var(--d-quick) ease}
.fcell:hover{background:var(--quiet)}
.fcell[data-on="true"],.fcell[data-on="true"]:hover{background:var(--acc-tint);box-shadow:inset 0 0 0 1px var(--acc-tint2)}
.fcell[data-dis="true"]{opacity:.45;pointer-events:none}
.fcell .t{display:flex;align-items:center;gap:8px}
.fcell b{font-size:13px;font-weight:600}
.fcell[data-on="true"] b,.fcell[data-on="true"] .d{color:var(--acc-text)}
.fcell .d{font-size:11.5px;line-height:1.45;color:var(--t3)}
.fcell .badge{display:inline-flex;align-self:flex-start;align-items:center;height:19px;padding:0 7px;border-radius:999px;font:500 10.5px var(--ui);background:var(--warn-tint);color:var(--warn-t)}
.cr-fmtbar{flex:none;display:flex;align-items:center;gap:11px;padding:10px 18px;border-bottom:1px solid var(--sep);background:var(--acc-tint);color:var(--acc-text)}
.cr-fmtbar b{font-size:12.5px;font-weight:600}
.cr-fmtbar .d{flex:1;min-width:0;font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-listhead{flex:none;display:flex;align-items:center;gap:12px;padding:13px 18px 11px}
.cr-list{flex:1;min-height:0;margin:0 8px 8px;border-radius:11px;box-shadow:0 0 0 1px var(--sep);background:var(--raised);display:flex;flex-direction:column;overflow:hidden}
.cr-list.over{box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.cr-cols{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--sep)}
.cr-rows{flex:1;min-height:0;overflow:auto}
.cr-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--sep);width:100%;transition:background var(--d-fast) ease}
.cr-row:hover{background:var(--quiet)}
.cr-row .hov{opacity:0;transition:opacity var(--d-quick) ease}
.cr-row:hover .hov{opacity:1}
.cr-row .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-mono{font:400 11.5px var(--mono);color:var(--t2)}
.cr-ord{width:52px;flex:none;display:flex;align-items:center;gap:5px}
.cr-ord .n{font:500 11.5px var(--mono);color:var(--t3);width:16px}
.cr-nudge{display:flex;flex-direction:column;gap:1px}
.cr-nudge button{width:15px;height:11px;display:grid;place-items:center;border-radius:3px;font-size:7px;color:var(--t3);background:var(--quiet2)}
.cr-empty{padding:52px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cr-empty .box{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--quiet);box-shadow:inset 0 0 0 1px var(--sep);font:600 12px var(--mono);color:var(--t3)}
.cr-more{display:flex;align-items:center;gap:10px;padding:11px 14px;width:100%;font-size:12px;color:var(--t3)}
.cr-foot{flex:none;display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--sep)}
.cr-path{flex:1;min-width:0;font:400 11.5px var(--mono);color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-blocked{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;border-radius:999px;font:500 11.5px var(--ui);background:var(--warn-tint);color:var(--warn-t)}
.cr-blocked button{font:600 11.5px var(--ui);color:var(--warn-t);text-decoration:underline}
.cr-prog{width:170px;flex:none;display:flex;align-items:center;gap:9px}
.cr-prog .track{flex:1;height:5px;border-radius:999px;background:var(--quiet3);overflow:hidden}
.cr-prog .fill{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width 120ms linear}
.cr-done{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:500 11px var(--ui);background:var(--ok-tint);color:var(--ok-t)}
.fld{display:flex;flex-direction:column;gap:5px}
.lbl{font:600 11px var(--ui);letter-spacing:.03em;text-transform:uppercase;color:var(--t3)}
.inp{min-height:29px;display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--sep2);font:500 12px var(--ui);background:var(--raised);transition:box-shadow var(--d-quick) ease}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit}
.rec{display:flex;flex-direction:column;gap:2px;padding:7px 9px;border-radius:8px;width:100%;text-align:left;transition:background var(--d-quick) ease}
.rec:hover{background:var(--quiet)}
.rec[data-on="true"],.rec[data-on="true"]:hover{background:var(--acc-tint)}
.rec .t{display:flex;align-items:center;gap:8px}
.rec .n{flex:1;min-width:0;font:500 12.5px var(--ui);color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec[data-on="true"] .n{font-weight:600;color:var(--acc-text)}
.rec .m{font:400 11px var(--mono);color:var(--t4);padding-left:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The three prototypes share one press: colour and shadow at 150ms, the squash at
   120ms so the button answers slightly ahead of its own tint. */
#pageEditor .press,#pageCreator .press,.set-win .press,.set-win .set-tab,.set-win .btn{
  transition:background-color 150ms ease,box-shadow 150ms ease,opacity 150ms ease,color 150ms ease,transform 120ms ease}
#pageEditor .press:active:not([disabled]),#pageCreator .press:active:not([disabled]),.set-win .press:active:not([disabled]){transform:scale(.97)}

@keyframes zoomIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes gridIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:.5;transform:translateX(16%) scale(1.05)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(26%)}to{opacity:1;transform:none}}
.m-zoom{animation:zoomIn 320ms var(--ease) backwards}
.m-grid{animation:gridIn 320ms var(--ease) backwards}
.m-fade{animation:fadeIn var(--d-fast) ease backwards}
.m-up{animation:slideUp 250ms var(--ease) backwards}
.m-left{animation:fromLeft 340ms var(--ease) backwards}
.m-right{animation:fromRight 340ms var(--ease) 40ms backwards}
@media (prefers-reduced-motion:reduce){.m-zoom,.m-grid,.m-fade,.m-up,.m-left,.m-right,.ed-mark{animation-duration:1ms}}

<script>
'use strict';
const shell = window.appWindow;
const $ = id => document.getElementById(id);
const work = $('work'), panel = $('panel'), panelBody = $('panelBody');
const contextMenu = $('contextMenu');
const panelResizeHandle = document.querySelector('[data-panel-resize]');
const isMac = shell?.platform === 'darwin';
const shortcutLabel = name => OneToolShortcutLabels.label(name, isMac);
const THEME_STORAGE = 'one-tool.theme';
let themeName = 'light';
let themeHydrated = false;
function readTheme() {
  try { return localStorage.getItem(THEME_STORAGE) === 'dark' ? 'dark' : 'light'; }
  catch { return 'light'; }
}
function applyTheme(next, persist = true) {
  themeName = next === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = themeName;
  document.documentElement.style.colorScheme = themeName;
  if (persist) {
    try { localStorage.setItem(THEME_STORAGE, themeName); } catch { /* storage may be unavailable */ }
    shell?.setTheme?.(themeName);
  }
}
applyTheme(readTheme(), false);
Promise.resolve(shell?.getTheme?.()).then(saved => {
  if (themeHydrated) return;
  if (saved !== 'dark' && saved !== 'light') {
    themeHydrated = true;
    return;
  }
  applyTheme(saved, false);
  try { localStorage.setItem(THEME_STORAGE, saved); } catch { /* storage may be unavailable */ }
  shell?.setTheme?.(saved);
  themeHydrated = true;
}).catch(() => { themeHydrated = true; });
function renderShortcutLabels() {
  document.querySelectorAll('[data-shortcut]').forEach(el => { el.textContent = shortcutLabel(el.dataset.shortcut); });
}
const pages = { convert: $('pageConvert'), creator: $('pageCreator'), editor: $('pageEditor') };
const setScrim = $('setScrim'), setWin = $('setWin');

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = bytes => { const n = Number(bytes || 0); if (!n) return ''; const u=['B','KB','MB','GB']; let v=n,i=0; while(v>=1024&&i<u.length-1){v/=1024;i++} return `${v.toFixed(v>=10||i===0?0:1)} ${u[i]}`; };
const fmtWhen = stamp => { const d = new Date(stamp); if (Number.isNaN(d.getTime())) return ''; const now=new Date();
  return d.toDateString()===now.toDateString() ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}); };
const byId = (items, key) => items.reduce((m, i) => { m[i[key]] = i; return m; }, {});

let tools=[], toolMap={}, files=[], counts={ready:0,helper:0,soon:0}, historyRecords=[];
let outputFolder='~/Converted', outputFolders=[];
let page='convert', selectedId=null, pickerFor=null, sheetFor=null, sheetPick=null, sheetCat=null, sheetQuery='';
/* The sidebar is not a thing you open — it is the detail of whatever is selected,
   so it appears when there is something to detail and leaves when there is not.
   Creator and Editor carry their own inspector, so the shared one stays away. */
/* The inspector is the app's one side panel, outside the workspace card. The
   Creator's output and recipes belong to it too, so they sit beside the
   workspace rather than inside it and its rounded corner. */
const inspectorHasContext = () =>
  (page === 'convert' && Boolean(selectedId || selectedHistory))
  || page === 'creator'
  || (page === 'editor' && editor.state.mode !== 'pair');
/* null preserves the selection-driven default. Alt+I sets an explicit user
   choice, including opening the batch sidebar before anything is selected. */
let inspectorOpen = null;
const inspectorVisible = () => inspectorOpen ?? inspectorHasContext();
let paletteOpen=false, query='', commandIndex=0;
let scope='this', advanced=true, keepNames=true, selectedHelper=null, selectedHistory=null;
let histFilter='all', histSort='newest', checked=new Set(), historyAnchorId=null;
let actionStatus='idle', toastTimer=null, lastSignature='';
let archivePromptId=null, archivePromptError='';
const archivePromptSeen = new Set();
let folderMenuState='closed', folderMenuTimer=null, contextTarget=null, contextMenuTimer=null;
let selectedQueueIds=new Set(), queueAnchorId=null;
const PANEL_WIDTH_STORAGE = 'one-tool.panel-width';
let panelWidth = 308, panelResizeSession = null;
/* Settings. The pane is app-wide preference, not per-document, so its values live
   in localStorage rather than in the backend's per-file state. Helpers is a
   category in here now; the installer list is still driven by the live registry. */
const SETTINGS_STORAGE = 'one-tool.settings';
const APP_VERSION = '3.2';
let settingsOpen=false, setTab='general', setQuery='', setVals={}, setOpenSel=null, setOpenHelper=null, setCopied=null;
let setCopiedTimer=null, installingHelper=null;
setVals = readSettings();
/* One-shot motion cues. Each set is filled when a real state transition is seen in
   absorb(), consumed by the next render, then cleared — so an unrelated re-render
   (selecting a row, opening a popover) never replays an entrance. */
let prevStatus = new Map(), prevCount = null, prevHelperDot = false, seenIds = new Set();
let freshRows = new Set(), freshDone = new Set(), freshError = new Set();
let countFresh = false, dotFresh = false, pendingAdd = false, bootstrapped = false;

const RANK = {ready:0, helper:1, soon:2};
const selectedFile = () => files.find(f => f.id === selectedId) || null;
function applyQueueSelection(event, id) {
  const result = OneToolSelectionState.updateSelection({
    ids: files.map(file => file.id), selected: [...selectedQueueIds], anchorId: queueAnchorId, targetId: id,
    shift: event.shiftKey, toggle: event.ctrlKey || event.metaKey,
  });
  selectedQueueIds = new Set(result.selected);
  queueAnchorId = result.anchorId;
  selectedId = selectedQueueIds.has(id) ? id : [...selectedQueueIds][0] || null;
  pickerFor = null;
  selectedHistory = null;
  render(true);
}
/* Ticking a box is about the list, not about which kind of row it is, so the
   range a shift-click covers is the visible list in full. */
function applyRowCheck(event, id) {
  const rows = visibleRows();
  const result = OneToolSelectionState.updateSelection({
    ids: rows.map(row => row.id), selected: [...checked], anchorId: historyAnchorId, targetId: id,
    shift: event.shiftKey, toggle: true,
  });
  checked = new Set(result.selected);
  historyAnchorId = result.anchorId;
  render(true);
}
const checkedOfKind = kind => { const rows = convertRows(); return [...checked].filter(id => rows.find(row => row.id === id)?.kind === kind); };
function applyHistorySelection(event, id, forceToggle=false) {
  const rows = visibleHistory();
  const result = OneToolSelectionState.updateSelection({
    ids: rows.map(record => record.id), selected: [...checked], anchorId: historyAnchorId, targetId: id,
    shift: event.shiftKey, toggle: forceToggle || event.ctrlKey || event.metaKey,
  });
  checked = new Set(result.selected);
  historyAnchorId = result.anchorId;
  selectedHistory = id;
  selectedQueueIds = new Set(); queueAnchorId = null; selectedId = null;
  render(true);
}
const selectedTool = f => f ? toolMap[f.conv] : null;
const routeCandidates = f => tools.filter(t => t.from === f?.from).sort((a,b) => (RANK[a.state]??3)-(RANK[b.state]??3) || a.to.localeCompare(b.to));
const isBlocked = f => f?.status === 'error' && /isn.t installed|needs|helper/i.test(f.errorTitle || f.error || '');
const sameKind = f => files.filter(i => i.from === f.from);
const scopeLabel = f => {
  if (scope === 'this' || !f) return scope === 'this' ? 'This file' : 'All matching files';
  const n = sameKind(f).length;
  return n === 1 ? `The 1 ${f.from} file` : `All ${n} ${f.from} files`;
};
const helperNames = () => [...new Set(tools.flatMap(t => [t.helper?.name, ...(t.requirements||[]).map(r => r.name)]).filter(Boolean))];
const helperData = name => {
  const direct = tools.find(i => i.helper?.name === name)?.helper;
  if (direct) return direct;
  const requirement = tools.flatMap(i => i.requirements || []).find(i => i.name === name);
  return requirement || {name, why:`${name} is used by one or more converters.`, cmd:'', url:'', download:'', found:false};
};
const helperFound = name => Boolean(helperData(name).found);
const helperTools = name => tools.filter(t => t.helper?.name === name || t.requirements?.some(r => r.name === name));
const waitingOn = name => files.filter(f => toolMap[f.conv]?.helper?.name === name && isBlocked(f));
const destCount = () => new Set(tools.map(t => t.to)).size;
const commonFolder = () => { if (!files.length) return outputFolder || '~/Converted'; const raw = files[0].out || outputFolder || '~/Converted'; return raw.replace(/[\\/][^\\/]+$/, '') || outputFolder || '~/Converted'; };
const routeStateLabel = t => t.state === 'ready' ? 'Ready' : t.state === 'helper' ? 'Needs helper' : 'Not built yet';
const routeStateClass = t => t.state === 'ready' ? 'ready' : t.state === 'helper' ? 'helper' : '';

function readPanelWidth() {
  try {
    const stored = localStorage.getItem(PANEL_WIDTH_STORAGE);
    return OneToolPanelResize.clampPanelWidth(stored === null ? 308 : stored, window.innerWidth);
  } catch { return OneToolPanelResize.clampPanelWidth(308, window.innerWidth); }
}
/* One width for every inspector in the app — the Convert panel and the panes
   Creator and Editor carry — so dragging one does not leave the others disagreeing
   about how wide an inspector is. */
function setPanelWidth(next, persist=true) {
  panelWidth = OneToolPanelResize.clampPanelWidth(next, window.innerWidth);
  const collapsed = OneToolPanelResize.isPanelCollapsed(panelWidth);
  document.documentElement.style.setProperty('--panel-width', `${panelWidth}px`);
  panel.dataset.collapsed = String(collapsed);
  /* A closed panel has to stay findable: the app marks the state so the handle
     can move fully inside the window and show its edge. */
  document.getElementById('app').dataset.panel = panelWidth === 0 ? 'closed' : 'open';
  document.querySelectorAll('.wk-side').forEach(side => { side.dataset.collapsed = String(collapsed); });
  document.querySelectorAll('[data-panel-resize]').forEach(handle => {
    handle.setAttribute('aria-valuenow', String(panelWidth));
  });
  if (persist) {
    try { localStorage.setItem(PANEL_WIDTH_STORAGE, String(panelWidth)); } catch { /* storage may be unavailable */ }
  }
}
function startPanelResize(event) {
  if (event.button !== undefined && event.button !== 0) return;
  const handle = event.target.closest?.('[data-panel-resize]');
  if (!handle) return;
  event.preventDefault();
  panelResizeSession = {startX: event.clientX, startWidth: panelWidth};
  work.dataset.resizing = 'true';
  document.body.classList.add('is-resizing-panel');
  handle.setPointerCapture?.(event.pointerId);
}
function movePanelResize(event) {
  if (!panelResizeSession) return;
  setPanelWidth(OneToolPanelResize.widthFromDrag(
    panelResizeSession.startWidth,
    panelResizeSession.startX,
    event.clientX,
    window.innerWidth,
  ), false);
}
/* Dragged past the point where the pane blanks, it closes on release rather than
   leaving an unreadable strip of panel behind. Dragging the handle back out
   brings it straight back. */
function settlePanelWidth() {
  setPanelWidth(OneToolPanelResize.snapPanelWidth(panelWidth));
}
function finishPanelResize() {
  if (!panelResizeSession) return;
  panelResizeSession = null;
  work.dataset.resizing = 'false';
  document.body.classList.remove('is-resizing-panel');
  settlePanelWidth();
}

setPanelWidth(readPanelWidth(), false);
/* Creator and Editor rebuild their pane on every render, so their handle is a new
   element each time. Listening on the document keeps one wiring for all of them. */
document.addEventListener('pointerdown', startPanelResize);
document.addEventListener('keydown', event => {
  const handle = event.target.closest?.('[data-panel-resize]');
  if (!handle) return;
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  const step = event.key === 'ArrowRight' ? 16 : -16;
  // Opening a closed panel from the keyboard goes straight to the width where
  // it is readable, rather than stepping through widths that re-close it.
  setPanelWidth(panelWidth === 0 && step > 0 ? OneToolPanelResize.MIN_WIDTH : panelWidth + step);
  settlePanelWidth();
});
document.addEventListener('pointermove', movePanelResize);
document.addEventListener('pointerup', finishPanelResize);
document.addEventListener('pointercancel', finishPanelResize);
window.addEventListener('resize', () => setPanelWidth(panelWidth, false));

/* ---------- server ---------- */
async function api(route, body, rerender=true) {
  const res = await fetch(route, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
  if (rerender) absorb(data);
  return data;
}
function absorb(data) {
  if (Array.isArray(data.files)) files = data.files;
  if (typeof data.outputFolder === 'string' && data.outputFolder) outputFolder = data.outputFolder;
  if (Array.isArray(data.outputFolders)) outputFolders = data.outputFolders;
  if (data.counts) counts = data.counts;
  if (Array.isArray(data.tools)) setTools(data.tools);
  const fileIds = new Set(files.map(file => file.id));
  selectedQueueIds = new Set([...selectedQueueIds].filter(id => fileIds.has(id)));
  if (queueAnchorId && !fileIds.has(queueAnchorId)) queueAnchorId = null;
  if (selectedId && !files.some(f => f.id === selectedId)) selectedId = files[0]?.id || null;
  if (!selectedId && files.length) selectedId = files[0].id;
  noteTransitions();
  const passwordFile = files.find(f => f.status === 'error' && /password|encrypted|data error/i.test(`${f.errorTitle || ''} ${f.error || ''}`) && !archivePromptSeen.has(f.id));
  if (passwordFile) { archivePromptSeen.add(passwordFile.id); archivePromptId = passwordFile.id; archivePromptError = ''; }
  render();
}
function noteTransitions() {
  files.forEach((f, index) => {
    const before = prevStatus.get(f.id);
    // rows arriving — stagger the first six only
    if (!seenIds.has(f.id)) { seenIds.add(f.id); if (bootstrapped && index < 6) freshRows.add(f.id); }
    if (before !== undefined && before !== f.status) {
      if (f.status === 'done') { freshDone.add(f.id); }
      if (f.status === 'error' && !isBlocked(f)) { freshError.add(f.id); haptic([12, 40, 12]); }
    }
    prevStatus.set(f.id, f.status);
  });
  [...prevStatus.keys()].forEach(id => { if (!files.some(f => f.id === id)) { prevStatus.delete(id); seenIds.delete(id); } });

  if (prevCount !== null && prevCount !== files.length) countFresh = true;
  prevCount = files.length;

  const dot = counts.helper > 0;
  if (dot && !prevHelperDot) dotFresh = true;
  prevHelperDot = dot;

  if (pendingAdd && files.length) pendingAdd = false;

  // batch finished — every file settled, at least one written
  const settled = files.length && files.every(f => f.status === 'done' || f.status === 'error');
  const anyDone = files.some(f => f.status === 'done');
  const nextActionStatus = OneToolActionState.nextActionStatus(actionStatus, files);
  if (nextActionStatus !== actionStatus) {
    actionStatus = nextActionStatus;
  }
  if (settled && anyDone && !batchAnnounced) { batchAnnounced = true; haptic(18); showToast('Batch finished', true, commonFolder()); loadHistory(); }
  if (!settled) batchAnnounced = false;

  bootstrapped = true;
}
let batchAnnounced = false;
/* Haptics are used for exactly two events: a finished batch and an unreadable file. */
function haptic(pattern) { try { navigator.vibrate?.(pattern); } catch { /* unsupported */ } }
/* Containers build one file out of many and accept no dropped file, so they are
   kept out of the Convert view's routes entirely and handed to the Creator. */
let containers = [];
function setTools(list) {
  const all = list || [];
  containers = all.filter(t => t.multi);
  tools = all.filter(t => !t.multi);
  toolMap = byId(tools, 'id');
}
async function loadHistory() {
  try { const res = await fetch('/api/history'); const data = await res.json();
    historyRecords = Array.isArray(data.history) ? data.history : []; render(); }
  catch (error) { showToast(error.message, false); }
}

/* ---------- render ---------- */
function signature() {
  return JSON.stringify([page, selectedId, inspectorVisible(), pickerFor, sheetFor, sheetPick, sheetCat, sheetQuery, paletteOpen, query, commandIndex,
    scope, advanced, keepNames, selectedHelper, selectedHistory, histFilter, histSort, [...checked], [...selectedQueueIds], queueAnchorId, historyAnchorId, actionStatus, outputFolder, outputFolders, folderMenuState,
    pendingAdd, countFresh, dotFresh, [...freshRows], [...freshDone], [...freshError],
    files.map(f => [f.id, f.name, f.from, f.to, f.conv, f.status, f.units, f.doneUnits, f.size, f.sourceSize, f.errorTitle, JSON.stringify(f.opts||{})]),
    tools.map(t => [t.id, t.state, t.helper?.found]), counts,
    historyRecords.map(r => [r.id, r.state, r.presence, r.size])]);
}
function render(force=false) {
  const next = signature();
  if (!force && next === lastSignature) return;
  // never rebuild the pane out from under a field the user is typing in
  const active = document.activeElement;
  const typing = active && (active.tagName === 'INPUT') && active.dataset.live === 'true';
  if (typing && !force) { lastSignature = next; return; }
  lastSignature = next;

  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  $('settingsBtn').setAttribute('aria-expanded', String(settingsOpen));
  const dotEl = $('helperDot');
  dotEl.hidden = !(counts.helper > 0);
  dotEl.classList.toggle('is-fresh', dotFresh);
  Object.entries(pages).forEach(([key, el]) => el.dataset.active = String(key === page));
  const panelVisible = inspectorVisible();
  panel.dataset.open = String(panelVisible);
  document.getElementById('app').dataset.inspector = String(panelVisible);
  /* Nothing to resize when there is no panel, so the handle goes with it. */
  if (panelResizeHandle) panelResizeHandle.hidden = !panelVisible;

  renderConvert(); renderCreator(); renderEditor(); renderSettings(); renderPanel(); renderOverlays();
  /* The panes were just rebuilt, so hand them the current width and collapse state. */
  setPanelWidth(panelWidth, false);
  renderShortcutLabels();
  // the cues have now been painted; clear them so nothing replays on the next render
  freshRows.clear(); freshDone.clear(); freshError.clear();

/* ---------- one list ----------
   Queued work and written output share a single table; the state a row is in is
   a column, not a separate view. Rows from the queue keep their live progress
   and route picker; rows from the history keep their presence check. A written
   file that is still in the queue is shown once, from the queue. */
const U_FILTERS = [
  {id:'all', name:'All'}, {id:'active', name:'Active'}, {id:'completed', name:'Completed'},
  {id:'stopped', name:'Stopped'}, {id:'missing', name:'Missing'}, {id:'comics', name:'Comics'},
  {id:'images', name:'Images'}, {id:'documents', name:'Documents'}, {id:'video', name:'Video'},
];
const SORTS = {newest:'Newest', oldest:'Oldest', name:'Name', largest:'Largest'};
const HIST_STATE = {

  uncompleted:{label:'Stopped', cls:'warn'}, missing:{label:'Missing', cls:'grey'},
};
const histCategory = r => String(toolMap[r.conv]?.cat || 'documents').toLowerCase();
const histState = r => r.presence === 'missing' ? 'missing' : (r.state || 'completed');
/* Live states come first, in the order work moves through them; the chosen sort
   decides everything after that. */
const U_RANK = ['running', 'queued', 'blocked', 'idle', 'error', 'stopped'];

const uRank = row => (U_RANK.indexOf(row.state) + 1) || 99;

function convertRows() {
  /* A file that has just been written is still in the queue and already in the
     history; it is shown once, from the queue, borrowing the record's timestamp
     so the Written column is filled the moment the row turns green. */
  const writtenAt = new Map(historyRecords.map(record => [`${record.sourcePath}|${record.to}`, record.finishedAt]));
  const queued = files.map(file => ({
    kind: 'queue', id: file.id, file, name: file.name, from: file.from, to: file.to,
    state: isBlocked(file) ? 'blocked' : file.status,
    cat: String(toolMap[file.conv]?.cat || 'documents').toLowerCase(),
    size: file.status === 'done' ? fmtSize(file.size) : '',
    when: file.status === 'done' ? fmtWhen(writtenAt.get(`${file.sourcePath}|${file.to}`)) : '',
  }));
  const inQueue = new Set(files.map(file => `${file.sourcePath}|${file.to}`));
  const written = historyRecords
    .filter(record => !record.deleted && !inQueue.has(`${record.sourcePath}|${record.to}`))
    .map(record => {
      const state = histState(record);
      return {
        kind: 'history', id: record.id, record, name: record.name, from: record.from, to: record.to,
        state: state === 'completed' ? 'done' : state === 'uncompleted' ? 'stopped' : state === 'active' ? 'running' : 'missing',
        cat: histCategory(record), size: fmtSize(record.size), when: fmtWhen(record.finishedAt),

function uMatches(row, id) {
  if (id === 'all') return true;

  if (id === 'stopped') return row.state === 'stopped' || row.state === 'error';
  if (id === 'missing') return row.state === 'missing';
  return row.cat === id;
}

  const all = convertRows();
  const order = all.map(row => row.id);
  return all.filter(row => uMatches(row, histFilter)).sort((a, b) => {
    const rank = uRank(a) - uRank(b);
    if (rank !== 0) return rank;
    if (histSort === 'name') return String(a.name).localeCompare(String(b.name));
    if (histSort === 'largest') return Number(b.record?.size || b.file?.size || 0) - Number(a.record?.size || a.file?.size || 0);
    if (histSort === 'oldest') return order.indexOf(b.id) - order.indexOf(a.id);
    return order.indexOf(a.id) - order.indexOf(b.id);

function unifiedRow(row, index, lastActive) {

    : row.id === selectedHistory;
  const dim = row.kind === 'queue' && selectedQueueIds.size > 0 && !selectedQueueIds.has(row.id) && !open;
  const isNew = freshRows.has(row.id);
  const delay = isNew ? ` style="animation-delay:${Math.min(index, 7) * 50}ms"` : '';
  const bar = meta.bar

function outputName(raw) {

/* Renaming names the output, not the source: the file on disk is the user's and

function outputStem(f) {

}
function outputExt(f) {

}
function historyRenameFieldHtml(r, state) {

/* ---------- feedback ---------- */
function showToast(title, ok=true, sub='') {
  clearTimeout(toastTimer);
  $('toastTitle').textContent = title;
  $('toastSub').textContent = sub;
  $('toastMark').innerHTML = ok ? tickIcon(12, 'draw') : ICON.alert;
  $('toastMark').classList.toggle('bad', !ok);
  $('toast').dataset.open = 'true';
  toastTimer = setTimeout(() => { $('toast').dataset.open = 'false'; }, 4200);
}
function setActionStatus(next) {
  actionStatus = next; render(true);
  if (next !== 'pending') setTimeout(() => { actionStatus = 'idle'; render(true); }, 1400);
}

/* ---------- actions ---------- */
function wireDrop(zone) {
  if (!zone) return;
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = async e => {
    e.preventDefault(); zone.classList.remove('over');
    pendingAdd = true; render(true);
    try {
    for (const file of [...e.dataTransfer.files]) {
      const source = shell?.getPathForFile?.(file) || file.path || '';
      try {
        if (source) await api('/api/add-path', {path: source});
        else {
          const res = await fetch('/api/upload', {method:'POST', headers:{'X-Filename':encodeURIComponent(file.name), 'X-File-Size':String(file.size)}, body:file});
          if (!res.ok) throw new Error('Upload failed');
          absorb(await res.json());
        }
      } catch (error) { showToast(error.message, false); }
    }
    } finally { pendingAdd = false; render(true); }
  };
}
async function chooseRoute(file, converterId) {
  const targets = scope === 'this' ? [file] : sameKind(file);
  try {
    for (const target of targets) await api('/api/route', {id: target.id, converter: converterId});
    pickerFor = null;
    showToast(targets.length === 1 ? 'Route changed' : `Route changed for ${targets.length} files`);
    render(true);
  } catch (error) { showToast(error.message, false); }
}
async function applyAll() {
  const file = selectedFile(); if (!file) return;
  const targets = sameKind(file);
  try {
    for (const target of targets) {
      if (target.id === file.id) continue;
      for (const key of ['title','creator']) if (file.opts?.[key] !== undefined) await api('/api/update', {id: target.id, key, value: file.opts[key]}, false);
    }
    showToast(`Applied to ${targets.length} files`);
  } catch (error) { showToast(error.message, false); }
}
async function convert() {
  if (actionStatus !== 'idle') return;
  const ready = files.filter(f => f.status === 'idle' && !isBlocked(f)).map(f => f.id);
  if (!ready.length) return;
  setActionStatus('pending');
  try { await api('/api/convert', {ids: ready}); showToast('Conversion started'); }
  catch (error) { setActionStatus('error'); showToast(error.message, false); }
}
async function unlockArchive() {
  const id = archivePromptId, input = $('archivePassword'), password = input?.value || '';
  if (!id) return;
  if (!password) { archivePromptError = 'Enter the archive password to continue.'; renderOverlays(); input?.focus(); return; }
  const button = document.querySelector('.archive-unlock');
  if (button) { button.disabled = true; button.textContent = 'Unlocking…'; }
  try {
    await api('/api/update', {id, key:'password', value:password}, false);
    archivePromptId = null; archivePromptError = '';
    await api('/api/convert', {ids:[id]});
    showToast('Archive unlocked', true);
  } catch (error) {
    archivePromptError = error.message;
    if (button) { button.disabled = false; button.textContent = 'Unlock archive'; }

}
async function historyAction(route, body, message) {
  try { await api(route, body); await loadHistory(); showToast(message); }
