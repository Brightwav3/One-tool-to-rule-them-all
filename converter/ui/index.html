<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Tool</title>
<link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<div class="app" id="app" data-inspector="true">

  <div class="wincontrols">
    <button id="winMin" aria-label="Minimise"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M1 5h8"/></svg></button>
    <button id="winMax" aria-label="Maximise"><svg id="winMaxIcon" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
    <button id="winClose" class="close" aria-label="Close"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M1 1l8 8M9 1L1 9"/></svg></button>
  </div>
  <div id="contextMenu" class="context-menu t-dropdown" data-origin="top-left" role="menu" aria-hidden="true"></div>

  <div class="body">
    <div class="left">

      <header class="topbar">
        <div class="tiphost">
          <button class="cog-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <g transform="translate(12 12) scale(0.87) translate(-12 -12)">
                <path d="M10.19 1.15 L13.81 1.15 L14.46 3.76 L16.09 4.43 L18.40 3.05 L20.95 5.60 L19.57 7.91 L20.24 9.54 L22.85 10.19 L22.85 13.81 L20.24 14.46 L19.57 16.09 L20.95 18.40 L18.40 20.95 L16.09 19.57 L14.46 20.24 L13.81 22.85 L10.19 22.85 L9.54 20.24 L7.91 19.57 L5.60 20.95 L3.05 18.40 L4.43 16.09 L3.76 14.46 L1.15 13.81 L1.15 10.19 L3.76 9.54 L4.43 7.91 L3.05 5.60 L5.60 3.05 L7.91 4.43 L9.54 3.76 Z"/>
              </g>
              <circle cx="12" cy="12" r="3.4"/>
            </svg>
            <span class="navdot" id="helperDot" hidden></span>
          </button>
          <span class="tip">Settings</span>
        </div>
        <nav class="nav" aria-label="Primary">
          <button class="navbtn press active" data-page="convert">Convert</button>
          <button class="navbtn press" data-page="creator">Creator</button>
          <button class="navbtn press" data-page="editor">Editor</button>
        </nav>
        <div class="searchwrap">
          <button class="search press" id="searchBtn" aria-label="Open command palette">
            <span aria-hidden="true">&#8981;</span><span class="label">Search conversions, files, helpers</span><span class="kbd" data-shortcut="palette">&#8984;K</span>
          </button>
        </div>
      </header>


      <div class="work" id="work">
        <section class="page" id="pageConvert" data-active="true" style="--px:-8px"></section>
        <section class="page" id="pageCreator"></section>
        <input id="crFiles" type="file" multiple hidden aria-hidden="true">
        <section class="page" id="pageEditor"></section>

        <div class="scrim sheet-scrim" id="sheetScrim" data-act="close-sheet"><div class="modal sheet" id="sheetBox" data-stop="true"></div></div>
        <div class="scrim pal-scrim" id="palScrim" data-act="close-palette"><div class="modal pal" id="palBox" data-stop="true"></div></div>
        <div class="scrim archive-scrim" id="archiveScrim" data-act="close-archive"><div class="modal archive-dialog" data-stop="true">
          <header class="archive-head"><b>Password-protected archive</b><p>One Tool needs the password to open this archive.</p></header>
          <div class="archive-body"><div class="archive-file"><span class="archive-lock">⌑</span><span class="archive-name" id="archiveName">archive.zip</span></div><label for="archivePassword">Archive password</label><input id="archivePassword" type="password" data-live="true" placeholder="Enter password"><p class="archive-help">Used only for this conversion. The password is never saved.</p><p class="archive-error" id="archiveError" hidden></p></div>
          <footer class="archive-foot"><button class="archive-cancel press" data-act="close-archive">Cancel</button><button class="archive-unlock press" data-act="unlock-archive">Unlock archive</button></footer>
        </div></div>
        <div class="toast" id="toast"><span class="m" id="toastMark"></span><span style="min-width:0"><b id="toastTitle"></b><span class="sub" id="toastSub"></span></span></div>
      </div>
      <div class="work-resize panel-resize" data-panel-resize role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
    </div>

    <aside class="panel" id="panel" data-open="true"><div class="panel-in"><div class="panel-top"></div><div id="panelBody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></div></aside>
  </div>

  <div class="scrim set-scrim" id="setScrim" data-act="close-settings"><div class="modal set-win" id="setWin" data-stop="true"></div></div>
</div>

<script src="/action-state.js"></script>
<script src="/panel-resize.js"></script>
<script src="/shortcut-labels.js"></script>
<script src="/selection-state.js"></script>
<script src="/editor-state.js"></script>
<script src="/creator-state.js"></script>
<!-- Creator → /api/create. Remove this one line to go back to the mock. -->
<script src="/creator-bridge.js"></script>
<script src="/legacy/monolith.js"></script>
</body>
</html>
